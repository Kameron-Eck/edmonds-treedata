# claims.yaml — the load-bearing numbers, each linked to the row that proves it.
#
# WHY. Registry entries point AT evidence; nothing pointed BACK. So when the 2026-09-06
# recalibration superseded the era F-numbers, the ledger kept stating the old ones for
# three days and the supersessions had to be found by hand. A claim here names the
# value AND the tracked row it came from, and `qc/verify_claims.py` re-resolves every
# pointer. A claim whose evidence has moved is reported DRIFTED — never silently
# corrected, because which side is wrong (the number, or the sentence around it) is a
# judgement a person makes.
#
#   id         stable slug
#   statement  the claim in words, as someone would say it out loud
#   value      the number/string as claimed
#   tolerance  optional; numeric comparison within +/- this (floating text, rounding)
#   evidence   ONE pointer, grammar in qc/claims.py
#   stated_in  every place this claim is written down — what to fix if it drifts
#   entry      the registry entry that owns the science
#
# Gated by qc/test_claims.py: pointers resolve, values match, stated_in files exist.

claims:
  - id: panel-a-net-change
    statement: >-
      Panel A's paired photo-interpretation measures a NET canopy change of -2.21
      percentage points of city area between 2016 and 2024.
    value: "-2.21"
    evidence: 'phase4/qc/panel_a_estimate.txt#regex:NET CHANGE (-?[0-9.]+) pp'
    stated_in:
      - experiments/panel_a_direction.yaml
      - Reports/LIT_HUNT_DIGEST_2026-09-06.md
    entry: panel_a_direction

  - id: panel-a-ci
    statement: "The 95% confidence interval on the Panel A net change is +/-1.10 pp."
    value: "1.10"
    evidence: 'phase4/qc/panel_a_estimate.txt#regex:95% CI \+/-([0-9.]+) pp'
    stated_in:
      - experiments/panel_a_direction.yaml
    entry: panel_a_direction

  - id: panel-a-n
    statement: "Panel A rests on 1,250 labelled paired points."
    value: "1250"
    evidence: 'phase4/qc/panel_a_estimate.txt#regex:labelled (\d+) live'
    stated_in:
      - experiments/panel_a_direction.yaml
    entry: panel_a_direction

  - id: sameflight-iou
    statement: >-
      One flight delivered two ways, scored by one frozen model, agrees at IoU 0.7376 —
      the processing-chain floor no downstream algorithm can remove.
    value: "0.7376"
    evidence: "phase4/qc/sameflight_consistency.csv#csv:canopy_iou@grid_px_m=1.0"
    stated_in:
      - experiments/sameflight_floor_c3.yaml
    entry: sameflight_floor_c3

  - id: lidar-decimation-artifact-gain
    statement: >-
      Bernoulli-thinning the dense lidar epoch to the sparse one's density fabricates
      1.5008 km2 of apparent GAIN and essentially no loss — density cannot fake loss.
    value: "1.5008"
    evidence: "phase4/qc/lidar_decimation_null.csv#csv:km2@quantity=artifact_gain"
    stated_in:
      - experiments/lidar_decimation_null.yaml
    entry: lidar_decimation_null

  # The two numbers below are ONE fact seen from two sides, and they are deliberately
  # two claims: a claim is verified on its `value` alone, so a second number carried in
  # the prose of the first is ungated and drifts silently. This one did — it read "81
  # tile directories" while the registry had grown to 82 (the offload pilot's second
  # 2017k directory), and nothing failed, because the pointer only ever checked 71.
  # Neither statement may spell the other's digit; they cross-reference in words.
  - id: tileset-count
    statement: >-
      The archive holds 71 distinct tile sets, one tracked tile list each — fewer than
      the tile directories on disk, because arms sharing a set share its tiles exactly,
      which is what makes those comparisons clean.
    value: "71"
    evidence: "phase4/qc/tilesets#dir_csv_count"
    stated_in:
      - docs/SCHEMAS.md
    entry: null

  - id: tileset-directories
    statement: >-
      Those sets are materialised in 83 tile directories (a count that grows by one per tile directory; refresh at landed.py) — one registry row per
      directory, keyed (label, run_tag), so a set built again under a second run tag is
      one set counted once and two directories on disk. Counting rows as sets is the
      defect `qc/coverage_map.py::tileset_census` exists to prevent.
    value: "83"
    evidence: "phase4/qc/tileset_registry.csv#rows"
    stated_in:
      - docs/SCHEMAS.md
    entry: null

  - id: curves-tracked
    statement: "Every scored arm's full precision-recall sweep is tracked: 87 curves."
    value: "87"
    evidence: "phase4/qc/curves#dir_csv_count"
    stated_in:
      - docs/SCHEMAS.md
    entry: null

  - id: sawtooth-is-sensitivity
    statement: >-
      At the held precision of the matched-cut series, reported canopy fraction tracks
      the model's recall at r = 0.9089 (exact permutation p = 0.0018 over all 40,320
      orderings). The residual year-to-year sawtooth is detector sensitivity moving,
      not canopy moving — which is what licenses an ASYMMETRIC correction, since the
      error is one-sided (the model misses real trees, it does not invent them).
    value: "0.9089"
    evidence: "phase4/qc/sensitivity_sawtooth.csv#csv:value@statistic=pearson_r_recall_vs_frac"
    stated_in:
      - Reports/CHANGE_DETECTOR_DESIGN_2026-09-06.md
    entry: trend8_uniform_rgb

  - id: matched-cuts-did-not-fix-jitter
    statement: >-
      Matching the operating point fixed the SIGN of the trend, not the year-to-year
      jitter: mean absolute step went from 3.06 pp (delivered cuts) to 3.29 pp
      (matched). Harmonisation is not what makes annual metrics readable.
    value: "3.29"
    evidence: "phase4/qc/sensitivity_sawtooth.csv#csv:value@statistic=matched_mean_abs_step_pp"
    stated_in:
      - Reports/CHANGE_DETECTOR_DESIGN_2026-09-06.md
    entry: trend8_uniform_rgb

  - id: detectability-not-ordered-by-resolution
    statement: >-
      Measured on our own archive, crown detectability is NOT ordered by ground
      resolution: at a 6 m minimum diameter, 2011s (38.1 cm effective) recalls 0.973 of
      bracketed crowns while 2015 (13.7 cm, nearly 3x finer) recalls 0.915. The
      per-epoch sensitivity dominates the pixel count, so a size gate must be per-epoch
      and cannot be derived from GSD alone.
    value: "0.9149"
    evidence: "phase4/qc/detectability_curve.csv#csv:recall@epoch=2015;kind=cumulative_ge;diam_lo_m=6"
    stated_in:
      - Reports/TEMPORAL_REFINEMENT_DESIGN_2026-09-06.md
    entry: null

  - id: detection-not-delineation
    statement: >-
      On the 137,901 crowns every epoch sees, the measured extent barely differs between
      epochs: mean cover spans 0.9699 (2015) to 0.9926 (2021), a 2.3% systematic
      difference, and 2011s at 38.1 cm reads 0.978 against 2024 at 6.8 cm reading 0.9707.
      Epochs differ in WHICH crowns they find, not in how well they outline the ones they
      find — so the healing problem is detection, not delineation, and a transplant needs
      no scale parameter.
    value: "0.9699"
    evidence: "phase4/qc/detectability_curve.csv#csv:recall@epoch=2015;kind=conditional_cover"
    stated_in:
      - Reports/TEMPORAL_REFINEMENT_DESIGN_2026-09-06.md
    entry: null

  - id: landmark-transform-tracks-geometry
    statement: >-
      The landmark transform — derived only from clusters BOTH epochs detected — recovers
      measured registration at r = 0.9457 (dx 0.993, dy 0.876), median error 0.074 m,
      exact permutation p = 0.0002 over all 5,040 relabellings with each shuffled world
      refitting its own sign bits. Its residual does not track recall (r = 0.148). The
      block-wise offset it replaces scored r = -0.245 against registration (wrong sign)
      and -0.450 against recall. Conditioning on mutual detection before estimating
      geometry is what fixes the contamination.
    value: "0.9457"
    evidence: "phase4/qc/landmark_transform_gate.csv#regex:^# r_est_vs_expected,([0-9.]+)"
    stated_in:
      - Reports/TEMPORAL_REFINEMENT_DESIGN_2026-09-06.md
    entry: change_detector_design

  - id: panel-a-gold-frozen
    statement: >-
      The Panel A gold set is frozen at 1,170 no-change / 42 loss / 2 gain, resolved by
      the semantics in panel_a_paired_change.step_estimate — the code that produced the
      -2.21 pp headline. The record's 1,169 no-change is not reproducible under any
      verify convention tested; loss and gain are stable under all of them. This set is
      a development set forever: 42 positives means held-out recall has sd 7.3 pp.
    value: "1170"
    evidence: 'phase4/qc/panel_a_gold.csv#regex:^# count_nochange,(\d+)'
    stated_in:
      - Reports/CHANGE_DETECTOR_DESIGN_2026-09-06.md
      - Reports/TEMPORAL_REFINEMENT_DESIGN_2026-09-06.md
    entry: panel_a_direction

  - id: local-field-real-but-not-exploitable
    statement: >-
      The local displacement field COMPOSES across epoch pairs — the A-B field is
      predicted by the A-R and B-R fields, which never saw it, at median r = 0.5857 with
      55 of 56 triples beating a shuffled-correspondence null at p < 0.05. So the
      structure is a property of the EPOCHS, not of the pairing: it is geometry. But its
      magnitude sits under the noise of a per-cell median — composed residual 0.452 m
      against a global-constant 0.433 m, beating global in only 15 of 56 triples — so it
      is not exploitable. The transplant is capped at one imagery-validated shift per
      epoch pair.
    value: "0.5857"
    evidence: 'phase4/qc/local_field_transitivity.csv#regex:^# median_r_composed,([0-9.]+)'
    stated_in:
      - Reports/TEMPORAL_REFINEMENT_DESIGN_2026-09-06.md
    entry: change_detector_design

  - id: healer-launders-nothing
    statement: >-
      Scored against the frozen gold, bounded temporal backfill launders ZERO of the 42
      verified losses — no terminal absence is filled and none is censored to IGNORE —
      while removing 99 of the 124 impossible canopy-gone-canopy triples at points a
      human verified as no-change. Five verified-loss points do receive an upstream heal
      at 2015, which is the operator working: the tree is present on both flanks and the
      loss still stands at the end.
    value: "0"
    evidence: 'phase4/qc/heal_vs_gold.csv#regex:^# loss_laundered,([0-9]+)'
    stated_in:
      - Reports/TEMPORAL_REFINEMENT_DESIGN_2026-09-06.md
    entry: change_detector_design
