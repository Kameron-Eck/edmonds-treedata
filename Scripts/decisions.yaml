    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      RETIRE the book from the tracker unless a review's claim comes to depend on it, in which case
      an interlibrary loan is the copy (the recommendation Kam accepted). Stage F therefore has no real
      book row and stays UNVALIDATED until one exists. Kam, 2026-09-22, verbatim: "litkb-coverage-definition: B, litkb-institutional-access:B litkb-shadow-hosts:a,b,c,d litkb-tdm-keys:Keys for both litkb-s47-colab-queue: You can use as much T4 time as you need, its cheap. I accept the rest of the reccomendations"
    why: >-
      It is the only book, so it decides whether the book path (S4.6 Stage F) has a real test row at
      all; every other answer is a rung that will never fire.
    evidence:
      - Reports/LITKB_PDF_SOURCES_SURVEY_2026-09-22.md
      - Reports/LITKB_TITLE_HUNTS_2026-09-21.md

  - id: litkb-s47-colab-queue
    question: >-
      S4.7's vision-language OCR rungs (olmOCR or Chandra ranked on the old-scan axes; a
      Swin-transformer or PaddleOCR formula decoder only if `litkb-second-formula-decoder` is
      re-opened) do not fit the local 4 GB T2000 and run only on Colab. CLAUDE.md section 3.4 says
      Claude asks before the FIRST launch of each queue, and S4.7 is launched unattended by S4.6.
      May S4.7 create ONE Colab queue — GPU tier L4 (T4 if L4 is unavailable), one runtime, the
      no-text-layer scans of the measurement bed as its input, an expected wall-clock of a few
      hours, and a cost of a single runtime's compute units — without a further ask, or must the
      queue wait for Kam to read S4.7's report first?
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      APPROVED, T4, unbounded: S4.7 may create Colab T4 runtimes for its vision-language OCR rungs
      as it needs without a further ask (Kam: "as much T4 time as you need, its cheap"). The plan's
      two-A100 ceiling and the one-queue-per-runtime rule are unchanged; a larger tier still asks. Kam, 2026-09-22, verbatim: "litkb-coverage-definition: B, litkb-institutional-access:B litkb-shadow-hosts:a,b,c,d litkb-tdm-keys:Keys for both litkb-s47-colab-queue: You can use as much T4 time as you need, its cheap. I accept the rest of the reccomendations"
    why: >-
      Without the queue S4.7 still lands its CPU and T2000 items and reports the vision-language
      rungs UNDETERMINED; with it the scan-tier measurement is complete in one session instead of
      two. The ask is recorded here so the unattended chain does not stall on it.
    evidence:
      - Reports/LITKB_PDF_SOURCES_SURVEY_2026-09-22.md

  - id: litkb-colab-page-boundary
    question: >-
      What may leave this laptop for a Colab runtime? pipeline/litkb/extract/colab_formula_worker.py
      is the only litkb code that runs off the laptop and its header says it never sees a PDF - the
      shard carries page-region CROPS, and the corpus stays local (litkb-p0-foundation). S4.7's
      vision-language OCR rung would ship WHOLE scanned PAGES of acquired PDFs to a T4 runtime.
      litkb-s47-colab-queue granted T4 TIME, not a data boundary, so the boundary is unruled.
      Three options: (a) whole pages may go, the shard is page images; (b) only strips or tiles, the
      way the formula worker crops, so no page ever leaves whole - text OCR on horizontal strips
      loses little, and this is the orchestrator's recommendation; (c) no Colab OCR at all, and the
      vision-language rung is reported UNDETERMINED.
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      (b) STRIPS, on the orchestrator's judgement — Kam delegated the S4.7 call. Only horizontal strips or
      tiles leave the laptop, cut the way pipeline/litkb/extract/colab_formula_worker.py crops formula
      regions, keyed by page and order so the OCR text comes back addressable; no scanned page ever leaves
      whole and the corpus stays local (litkb-p0-foundation). A strip rung that cannot be built means the
      vision-language rung is reported UNDETERMINED, never a page shipped. Kam, 2026-09-22, verbatim: "Implement your best judgement on S4.7. Also i want to start S4 from scratch. And I dont want it to launch S5 at the end. Only I can launch a session"
    why: >-
      S4.7's vision-language rung is the only item that waits on this; every other rung of that
      session lands on the T2000 regardless. Unruled, a session either ships the corpus off the
      laptop against the foundation ruling, or drops a rung Kam has already paid T4 time for.
    evidence:
      - Scripts/pipeline/litkb/extract/colab_formula_worker.py
      - Reports/LITKB_PDF_SOURCES_SURVEY_2026-09-22.md

  - id: litkb-session-launch-authority
    question: >-
      Does a session launch the next one when it reaches its done-state (the chaining instruction of
      2026-09-20: lessons into the project files, then launch S<n+1> headless), or does only Kam launch?
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      ONLY KAM LAUNCHES A SESSION. A session's last act is to WRITE the next session's launch kit under
      _derived/<next>/ — the prompt file from that session's plan block, an mcp.json carrying its
      LITKB_SESSION, the launch script — record in "Where we are" that the kit is ready, and STOP. It never
      runs claude, never opens a terminal window, never creates a runtime for another session. The
      2026-09-20 chaining instruction is withdrawn. Kam, 2026-09-22, verbatim: "Implement your best judgement on S4.7. Also i want to start S4 from scratch. And I dont want it to launch S5 at the end. Only I can launch a session"
    why: >-
      A chained launch is a launch nobody watched: S4's runs 1 and 2 (2026-09-21) started themselves
      overnight, ran unmonitored and were ruled untrusted. A kit that waits for Kam is a kit Kam has read.
    evidence:
      - Scripts/LITKB_WORKPLAN.md
      - Scripts/CHATLOG.md
  - id: litkb-live-migration-by-session
    question: >-
      Who applies a merged litkb migration to the LIVE database — Kam by hand (the per-session protocol's
      "Kam applies any migration"; the auto-mode classifier refused Claude in S3), or the session that
      merged it?
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      THE SESSION APPLIES IT. Only after an independent auditor has passed the MERGED candidate and the
      merge is on main, the orchestrator applies it with the project's own runner from the main tree
      (`py -3.12 -m litkb.db.migrate --db litkb`) and verifies it by preflight's migration_mismatch=0.
      Never from a builder's branch, never before the audit. Kam, 2026-09-22, verbatim, typed into the
      S4 run-3 terminal in reply to "live migrations are Kam's to apply": "I should not be doing anything
      by hand". Not read into it: session launches stay Kam's (litkb-session-launch-authority).
    why: >-
      A step only Kam can take is a step every session waits on: S3 opened with 0028 unapplied and ran its
      URL rows only after Kam applied it by hand. The audit of the merged candidate is the check a human
      application stood in for.
    evidence:
      - Scripts/LITKB_WORKPLAN.md
      - Scripts/pipeline/litkb/db/migrate.py
  - id: litkb-extract-page-cap
    question: >-
      The extraction page cap S4 must enforce fail-closed has no value in code or docs (S4 run 3 code
      survey C4). Which value — (a) 400, the one reasoned page ceiling the code holds
      (binding.OCR_BIND_MAX_PAGES, "a book is not a cover sheet"); (b) 100, which makes the real 101-page
      Riva_2017 report a positive row but refuses an in-scope report nobody ruled out; (c) another? And
      after how many failed attempts does a queue job go dead (recommended 3)?
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      (a) EXTRACT_PAGE_CAP = 400 pages (pipeline/litkb/extract/probe.py, one constant every site
      imports); MAX_JOB_ATTEMPTS = 3. First adopted by recommendation under the 10-min rule (the
      question was put in the S4 run-3 terminal with options and the recommendation first), then
      CONFIRMED by Kam in the same terminal, 2026-09-22, verbatim: "400 is fine, keep going" The corpus's longest active file is 101 pages, so the cap refuses book-sized
      volumes only; its known-bad is a CONSTRUCTED cap+1-page PDF. A different answer from Kam changes
      one line.
    why: >-
      The plan asks for an enforced, fail-closed cap, and the rule is never to invent a number: this one
      reuses the only reasoned ceiling in the code rather than picking one.
    evidence:
      - Scripts/pipeline/litkb/extract/probe.py
      - Scripts/pipeline/litkb/admit/binding.py
