  - id: litkb-from-file-version-state
    question: >-
      Every operator bind — `acquire --from-file`, and every route landing — writes
      file_versions.state='promoted' with promotion_id NULL (0003_write_functions.sql sets it for
      every bind; the E25 auditor confirmed it is not an anomaly). A web snapshot or a manual
      admission is a `proposed` version that a SECOND session approves; a PDF the operator supplies
      by hand is not. Should an operator-supplied file be a `proposed` version behind the same
      second-session gate, or stay a direct bind?
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      THE PROPOSAL PATH: an operator-supplied file (`--from-file`) lands as a `proposed` version a
      second session approves, like a web snapshot, with approvals BATCHED so one headless session
      clears many. The gate exists so a file's identity is confirmed by someone who did not bind it.
      Kam, 2026-09-22, verbatim: "litkb-coverage-definition: B, litkb-institutional-access:B litkb-shadow-hosts:a,b,c,d litkb-tdm-keys:Keys for both litkb-s47-colab-queue: You can use as much T4 time as you need, its cheap. I accept the rest of the reccomendations"
    why: >-
      The second-session gate exists so a file's identity is confirmed by someone who did not bind
      it. Today it covers pages and manual records but not hand-supplied PDFs, so a wrong
      `--from-file` binds straight into main. Gating it costs one more approval per copy Kam
      supplies (the E23 residue, the blocked works); not gating it keeps `--from-file` the
      one-command path it is now.
    evidence:
      - pipeline/litkb/db/migrations/0003_write_functions.sql
      - Reports/LITKB_EDGES_2026-09-21.md


  - id: litkb-coverage-target
    question: >-
      What share of the tracker's studies must litkb hold as a PDF, and by what means, for the
      acquisition work to be done? The 2026-09-21 plan named no number; the survey report's
      measured table (Reports/LITKB_PDF_SOURCES_SURVEY_2026-09-22.md section M) shows about half
      of the works in main with a file.
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      NINETY-FIVE PERCENT of the tracker's studies with a PDF, by AUTOMATED means, through a LAYERED
      ladder where each rung may catch only a few but together they catch nearly all. Kam's words:
      "The goal it to get the pdf by all means in an automated way. So we may have some methods that
      may only work for a sparse amount of pdfs, but collecteivly we want to be able to catch the
      pdfs … We are aiming for 95 percent of the studies having pdfs." Recorded with the survey's
      measured caveat, so the target is not mistaken for a forecast: the demonstrated number for a
      corpus of this shape by legitimate automated means is about 86 percent (the survey report,
      section 6.3), and the difference is closed by the rulings this entry blocks, not by more
      open-access indexes. The denominator is the tracker after the record-class filter; which
      grades of "has the study" count is `litkb-coverage-definition`.
    why: >-
      A target with no number cannot be measured, and a number with no stated means invites a
      shadow-library route to be built by default. Both halves are Kam's; the plan builds to them.
    blocks: [litkb-coverage-definition, litkb-institutional-access, litkb-shadow-hosts, litkb-tdm-keys]
    evidence:
      - Reports/LITKB_PDF_SOURCES_SURVEY_2026-09-22.md

  - id: litkb-coverage-definition
    question: >-
      Does "has the study" mean a PDF file, or a searchable, quotable source of any kind? The
      survey (section 6.2) shows works that will never exist as PDFs — agency reports served as HTML,
      articles where only a full-text XML or a quotable snippet is free — and works whose PDF exists
      but whose text can never reach quote-grade (1950s–90s scans, section 5.8). Two definitions:
      (a) PDF-only, so those works stay misses; (b) any source with a verifiable quote — pdf, jats,
      html-doc, cached_text, snippet — counts, with the grade recorded, and quote-grade text is a
      separate tier from searchable text.
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      (b): "has the study" means ANY full text with verifiable quotes — a PDF, a JATS XML
      full text, or a full-text HTML document — with the grade recorded per work; cached page text and
      snippets are REPORTED separately and never counted toward `litkb-coverage-target`. The coverage
      instrument prints both numbers; the bound is on the full-text grades. Quote-grade text on old
      scans is a separate tier from searchable text (S4.7). Kam, 2026-09-22, verbatim: "litkb-coverage-definition: B, litkb-institutional-access:B litkb-shadow-hosts:a,b,c,d litkb-tdm-keys:Keys for both litkb-s47-colab-queue: You can use as much T4 time as you need, its cheap. I accept the rest of the reccomendations"
    blocked_by: [litkb-coverage-target]
    why: >-
      Under (a) the target needs the shadow tier or credentials to be reachable at all; under (b)
      the grey-literature and XML rungs count and the OCR boundary is stated honestly. The coverage
      instrument prints both numbers either way; the ruling decides which one is the bound.
    evidence:
      - Reports/LITKB_PDF_SOURCES_SURVEY_2026-09-22.md

  - id: litkb-institutional-access
    question: >-
      Does Kam have institutional access to any publisher (a university or agency login, a proxy,
      a browser profile already signed in), and may litkb drive that logged-in browser profile
      (Playwright over the user's own profile; no credential stored or scripted by litkb) as the
      credentialed rung? The survey (section 6.1) finds it the ONLY rung that converts the ledger's
      manual-step rows and the paywalled remainder by legitimate means; without it their catch is
      zero. No round asked this question.
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      (b): NO institutional access. litkb drives no logged-in profile; the survey's H10/H11 rungs
      are not built; the manual-step rows and the paywalled remainder fall to the shadow tier
      (`litkb-shadow-hosts`), to the human queue of `litkb-blocked-works-grade`, or to
      metadata-grade. The target's arithmetic is therefore the open-access ladder plus the shadow tier
      plus the definition ruled in `litkb-coverage-definition`. Kam, 2026-09-22, verbatim: "litkb-coverage-definition: B, litkb-institutional-access:B litkb-shadow-hosts:a,b,c,d litkb-tdm-keys:Keys for both litkb-s47-colab-queue: You can use as much T4 time as you need, its cheap. I accept the rest of the reccomendations"
    blocked_by: [litkb-coverage-target]
    why: >-
      If yes, it is the single largest converter in the whole survey and S4.6 builds Stage H around
      it; if no, S4.6 drops the rung and the paywalled remainder falls to the shadow tier or to
      copies, and the target's feasibility changes.
    evidence:
      - Reports/LITKB_PDF_SOURCES_SURVEY_2026-09-22.md

  - id: litkb-shadow-hosts
    question: >-
      Kam's standing grant covers Anna's Archive and Sci-Hub as last-resort routes. The survey
      (section 1, Stage G) read four more shadow rungs in code, never contacted: LibGen's JSON DOI
      lookup and delivery mirrors, the sci.bban.top DOI path (no bot check, clean 404), the
      Nexus/STC gateway, Tor as a transport for blocked mirrors, and a real browser session driven
      against Anna's Archive itself (the survey's G3a). A second half, from survey round 3: does
      fetching an OFFLINE metadata dump — an Anna's derived-mirror torrent, a LibGen SQL dump — count
      as contacting a shadow host? (The public Sci-Hub DOI list and the LibGen article table on GitHub
      and figshare do not, and the plan builds on those without waiting.) Does the grant extend to any
      of them, and under what policy switch (the survey's PolicyDecision object makes each host an
      auditable line, not a code path)?
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      ALL FOUR: (a) Anna's Archive and Sci-Hub stay granted; (b) LibGen's DOI lookup and delivery
      mirrors and the sci.bban.top DOI path are granted; (c) Nexus/STC delivery and Tor as a transport
      are granted; (d) a real browser session driven against Anna's Archive is granted. Offline metadata
      dumps (an Anna's derived-mirror torrent, a LibGen SQL dump) are DATA, not contact with a host, and
      may be fetched. Every host is one auditable line in the pre-fetch policy object; the tier runs only
      after every legitimate rung has missed; the corpus froze in early 2022 so a later DOI is
      out-of-corpus by construction; Tor is built only if a granted host is unreachable without it
      (the survey grades it verified as a mechanism, dead as an implementation). Kam, 2026-09-22, verbatim: "litkb-coverage-definition: B, litkb-institutional-access:B litkb-shadow-hosts:a,b,c,d litkb-tdm-keys:Keys for both litkb-s47-colab-queue: You can use as much T4 time as you need, its cheap. I accept the rest of the reccomendations"
      REAFFIRMED 2026-09-24 during S4.5, Kam verbatim: "We will meet Sci-Hub (5b). Its legal in my country." and
      "You wont connect me to the shadow libraries, but I would like the documentation to reflect my plan to connect to
      them". The plan stands as written: the goal is maximum coverage, and the shadow tier is part of it. The agent
      running S4.5 does not work on the shadow tier (a safety classifier stopped that work); that is a limit on the
      agent, not a change to this decision or to the plan.
    blocked_by: [litkb-coverage-target]
    why: >-
      These are the strongest mechanical route to the pre-2021 paywalled slice and they are also the
      ones a plan must not build by default. The Sci-Hub corpus froze around 2021, so the ceiling is
      the old slice; nothing in this tier reaches the agency reports or theses.
    evidence:
      - Reports/LITKB_PDF_SOURCES_SURVEY_2026-09-22.md

  - id: litkb-tdm-keys
    question: >-
      Springer and Elsevier issue free text-and-data-mining API keys; Wiley and IEEE have TDM
      endpoints too. Should Kam register keys for litkb? The survey (section 6.2) measured what they
      buy: open-access content only — an unentitled Elsevier key answers HTTP 200 with a first-page
      stub announced only in a response header, and the IEEE endpoint returns a URL but no bytes
      without institutional access. Expected yield on the paywalled residue is near zero; the keys
      matter for hybrid and bronze articles the landing-page rule cannot reach.
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      ELSEVIER ONLY (amended the same evening): Kam registered Elsevier's free key and had it placed at
      D:\edmonds-pipeline\secrets\Elsevier_key.txt (his words: "Elsvier api key is not a important secret … We
      wont be getting a springer api key"); no Springer key, so H1 is not built and Springer open-access
      content stays on the Unpaywall rung. The Elsevier key buys open-access and bronze content only; an
      unentitled answer is a first-page stub the acceptance test refuses; its yield is recorded the first
      time it runs. MEASURED 2026-09-22 within the hour of placement (qc/instruments/litkb_acq_probe_elsevier_key.py →
      phase4/qc/litkb_acq_probe_elsevier_key.csv): the key is VALID — Scopus Search answers 200 — but every
      ScienceDirect endpoint refuses it at the key-configuration level: Article Retrieval 403
      AUTHENTICATION_ERROR "Requestor configuration settings insufficient" even at view=META on a GOLD
      open-access article, ScienceDirect Search and Metadata 401 AUTHORIZATION_ERROR. As configured the key
      buys Scopus metadata (EID, PII, openaccess flag, cited-by), not full text. Elsevier's own page says
      non-subscribers "can still retrieve free and open access content -- or speak to us about
      non-subscriber access". The likely cause (Kam: the form asked for a label and a website URL): the
      key form carries TWO consent boxes, the API Service Agreement and the TDM Provisions, and the
      ScienceDirect endpoints are what the second enables ("Text Mining API Keys" in Elsevier's settings
      table); the website URL is optional. Kam replaced the key the same evening and the re-run was
      IDENTICAL (Scopus 200, every ScienceDirect endpoint refused), so the refusal is Elsevier's
      non-subscriber key profile rather than the form. Open action, Kam's: Elsevier API support ("speak
      to us about non-subscriber access"); H2 stays unbuilt until the instrument shows a ScienceDirect 200.
      First ruling, Kam, 2026-09-22, verbatim: "litkb-coverage-definition: B, litkb-institutional-access:B litkb-shadow-hosts:a,b,c,d litkb-tdm-keys:Keys for both litkb-s47-colab-queue: You can use as much T4 time as you need, its cheap. I accept the rest of the reccomendations"
    blocked_by: [litkb-coverage-target]
    why: >-
      Registration is Kam's identity on a publisher's account; the yield is small and measured; the
      stub hazard is real and S4.5's acceptance test already refuses it. Worth deciding once so no
      session re-proposes it.
    evidence:
      - Reports/LITKB_PDF_SOURCES_SURVEY_2026-09-22.md

  - id: litkb-crc-book
    question: >-
      The corpus's one book (E20, VanDenHout_2016, CRC Press, ISBN 9781466568419, electronic only)
      has NO automated route: the publisher's platform needs a browser-session token, no open-access
      or archive source holds it, and the survey (section 4) calls it a purchase or interlibrary-loan
