  - id: litkb-book-policy
    question: >-
      May a hunt spend on a BOOK (open access, the archive, Sci-Hub), what terminal state is a
      book with a copy, and what identifiers does a book need? Register row E20 — the corpus
      holds one book (VanDenHout_2016, DOI-only, no ISBN anywhere, zero files, no attempt ever
      made).
    owner: kam
    status: decided
    decided: "2026-09-21"
    decision: >-
      BOOKS ARE IN SCOPE FOR ACQUISITION on every route, like papers. EXTRACTION IS DEFERRED:
      the OCR/extraction pipeline is not ready for books, so an acquired book ends
      `bound-unextracted` and S4's completeness classifier names it (a book residue class /
      `over-page-cap`), never silently "extracted". Book identifiers (ISBN first) must be
      harvested into the corpus at admission — Crossref carries `ISBN` on type=book records —
      because the archive route looks a book up by ISBN to reach an md5, which the DOI-only
      scidb path cannot; that lookup is S5 build work. Kam's words: "The system is allowed to
      get book … ISBN and other book identifiers need to be in the corpus … I say we acquire
      the book and don't spend. The OCR pipeline doesn't seem ready for books." Claude's
      reading of "don't spend", recorded so it can be corrected: spend no EXTRACTION effort on
      books yet; acquisition routes are allowed. The E20 register row carries the measured
      pair from the first live hunt (2026-09-21) as its expected state.
    why: >-
      A DOI-only book admits cleanly through Crossref but the acquisition routes are
      paper-shaped (scidb by DOI) and a whole book blows through the extraction page cap S4
      enforces; the ruling separates the two so acquisition proceeds while extraction waits on
      a pipeline that can classify a book instead of choking on it.
    evidence:
      - Reports/LITKB_EDGES_2026-09-21.md
      - Reports/LITKB_TITLE_HUNTS_2026-09-21.md

  - id: litkb-sibling-edition
    question: >-
      Are a preprint and its published article ONE work or TWO? Register row E21 — the
      corpus's one clean pair, Valavi 2018 (bioRxiv 10.1101/357798, held; MEE
      10.1111/2041-210x.13107, extracted), two works today with a tracker `duplicate_of`
      discrepancy recording the tracker's belief that they were one.
    owner: kam
    status: decided
    decided: "2026-09-21"
    decision: >-
      TWO WORKS, linked. Each edition is its own work with its own file, blocks and page
      numbers; a citation names the edition it read. The tie is recorded as an explicit
      identifier-to-identifier relation edge read from the registry (Crossref `relation`:
      isPreprintOf / hasPreprint / isVersionOf), never inferred from titles and never an alias
      (the linkage review's P2, now decided; the edge itself is S5 build work). A hunt of the
      preprint DOI therefore resolves to ITS OWN work and is not refused as a duplicate of the
      article.
    why: >-
      A verbatim quote with a page number is the base's whole contract. Preprint and journal
      text differ — pagination, sometimes results — so aliasing would let a quote taken from the
      preprint carry the journal's citation. Two works keep every quote attached to the edition
      that contains it.
    evidence:
      - Reports/LITKB_LINKAGE_REVIEW_2026-09-15.md
      - Reports/LITKB_EDGES_2026-09-21.md

  - id: litkb-registry-over-claim
    question: >-
      Twenty-two held-queue rows (register row E24) and fifteen more (E23) could not be admitted
      because the tracker's claimed first author or year contradicts the registry record for a
      DOI whose title matches at >= 0.85. Check 1 and the title resolver both side with the
      claim, so no hunt of any kind can settle them. Which side is authoritative?
    owner: kam
    status: decided
    decided: "2026-09-21"
    decision: >-
      THE REGISTRY RECORD, when the title matches and the tracker's own relevance sentence
      describes that paper. Measured before ruling (Reports/LITKB_TITLE_HUNTS_2026-09-21.md and
      the wrap-up's Crossref check): of the fourteen "registry-quirk" rows, four name a coauthor
      as first author, one is an AMS early-release year gap, and ten name an author who is not on
      the paper at all — yet in all ten the tracker's relevance sentence matches the registry
      abstract or record. The tracker is an LLM-drafted table that got the paper right and the
      byline wrong. The recipe, as it actually ran (Reports/LITKB_RULED_HUNTS_2026-09-21.md):
      a drop-off carrying the TRACKER'S claim verbatim; then a BARE hunt by IDENTIFIER (DOI /
      arXiv id / URL) with no claimed metadata, so admission lands on the registry record; then
      `hunt --hunt-request <id> --no-spend`, which links the drop-off from the cache. NOT
      `--hunt-request` on the first hunt: it re-injects the claim into check 1 and refuses like
      the title run did. (admit_registry already has a `registry_only` mode, migration 0020 —
      the generalised path S5 owes is that mode behind a human's say-so.) Rows whose
      identifier no registry holds (a Chinese-language journal, an internal 1986 note) stay held
      unless a copy exists for --from-file. Row 33's quoted numbers may belong to a different
      paper by the tracker's named author (Wagner 2024) — verified at extraction, not assumed.
    why: >-
      A title hunt re-applies the admission gate's own tests to the claim it was given, so it can
      only confirm the claim, never correct it; correction needs a human to say which record is
      the paper, and the evidence for that (title, abstract, relevance) exists without a file.
    evidence:
      - Reports/LITKB_TITLE_HUNTS_2026-09-21.md
      - Reports/LITKB_RULED_HUNTS_2026-09-21.md

  - id: litkb-e23-residue-copies
    question: >-
      Register row E23's residue — tracker rows 53 (a Chinese-language journal article) and 369
