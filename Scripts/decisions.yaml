  - id: litkb-autonomy-grant
    question: >-
      Every merge and push that waited on Kam stalled a multi-session programme, and the
      auto-mode classifier refused pushes even after verbal grants. What may Claude do in git
      without asking?
    owner: kam
    status: decided
    decided: "2026-09-20"
    decision: >-
      "Complete autonomy to merge, commit, push, archive files in the git. We don't delete."
      Claude commits on work/… and fix/…, merges them into main, pushes main, and archives.
      The boundary is deletion: no branch or tag deletion, no `push --delete`, no force-push, no
      forced worktree removal, no reset of main — archive instead. The grant is git only:
      science decisions, GPU spend and live migrations are unchanged. The classifier refuses
      Claude editing `settings.json` (self-modification) and the CLAUDE.md §3.1 rule text
      (instruction poisoning) to encode this, so Kam ran `jobs/litkb-s0/grant_git_autonomy.py`.
    why: >-
      The plan reaching `litkb-finish-line` spans eight sessions; a human gate on every merge is
      the stall it was written to remove, and "archive, never delete" keeps every result
      recoverable.
    evidence:
      - LITKB_WORKPLAN.md

  - id: litkb-k2-no-seeding
    question: >-
      Proving run 2 SEEDED the false expectation that let K2 fire. For proving run 3, where the
      scout discovers the works itself, should K2 be allowed to fire on a seeded expectation, or
      must it fire naturally — with an UNDETERMINED outcome and a bounded rerun if it does not?
    owner: kam
    status: decided
    decided: "2026-09-20"
    decision: >-
      NO SEEDING. The scout states its confidence per expectation; K2 fires naturally or the run
      is UNDETERMINED on K2 and gets ONE bounded rerun on another topic, under an attempt limit
      fixed before launch — exhaustion is UNDETERMINED, never a quiet extra try. An expectation
      can go UNCONFIRMED without its paper being acquired, so the S5 acceptance counters
      separate "unconfirmed" from "not acquired".
    why: >-
      A seeded negative proves the honesty machinery can fire; only an unseeded one proves the
      scout's priors are being tested. This EXTENDS how `litkb-operational-definition` is
      exercised (run 2 seeded), which is why it was put to Kam as a question rather than folded
      into the plan. Proposed by Claude on Codex's review of the plan; ruled by Kam the same day.
    evidence:
      - LITKB_WORKPLAN.md

