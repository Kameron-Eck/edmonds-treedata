      Standing intent: any literature used by the project flows through this knowledge base.
      Design rev 3 follow-ups (Kam, 2026-09-14): §15.9 GROBID runs locally under WSL2 Ubuntu
      (Kam installing the distro); §15.16 local workers keep 20% of RAM and CPU free for Kam's
