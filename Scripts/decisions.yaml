      - Reports/LITKB_TITLE_HUNTS_2026-09-21.md

  - id: litkb-blocked-works-grade
    question: >-
      The ruled run of 2026-09-21 left a set of admitted, registry-confirmed works with no file:
      open access holds no copy, the archive does not hold them, Sci-Hub answers 403 (the rows
      whose hunt_state is `blocked` in Reports/LITKB_RULED_HUNTS_2026-09-21.csv). Two grades are
      possible: METADATA-grade (admitted, citable by its record, never quotable — every drop-off
      expectation on it stays UNCONFIRMED) or a copy supplied by `--from-file`. The PDF-sources
      survey's "deferred human fulfilment" rung (G4 — a request queue a human answers) is the
      `--from-file` half of this question, not code. Which grade, and for which rows?
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      METADATA-GRADE by default — admitted, citable by its record, never quotable, every
      expectation on it UNCONFIRMED — with the human queue (the survey's G4: a request answered by a
      person, `--from-file`) on demand only for the works a review's claim actually needs. The coverage
      instrument reports them as metadata-grade so the number stays honest. Kam, 2026-09-22, verbatim: "litkb-coverage-definition: B, litkb-institutional-access:B litkb-shadow-hosts:a,b,c,d litkb-tdm-keys:Keys for both litkb-s47-colab-queue: You can use as much T4 time as you need, its cheap. I accept the rest of the reccomendations"
    why: >-
      A quote needs a file; a review that cites a metadata-grade work can only say what the
      record says. Without a grade, S4.5's back-off keeps probing these works once per run and
      S5's counters carry them as unconfirmed for the life of the base.
    evidence:
      - Reports/LITKB_RULED_HUNTS_2026-09-21.md

  - id: litkb-scihub-parked
    question: >-
      Sci-Hub has delivered no file on any hunt since the route was built (all-time census:
      litkb.acquisition_attempts grouped by route and status — every scihub row is blocked or
      not-in-archive; Reports/LITKB_EDGES_2026-09-21.md records the four mirrors answering
      blocked or no-pdf-link live). S4.5's per-route back-off bounds the route's cost to one
      probe per run. Should the route ALSO be parked by default (kept in ROUTES, skipped unless a
      hunt asks for it), or stay live as the last rung of the ladder Kam granted?
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      NOT PARKED — REVERSED the same day. Kam's first ruling (accepting the recommendation to park)
      stood for a few hours; then, verbatim: "I do want to attempt a work around for scihub. Scihub is
      a massive loss if we table it." So: Sci-Hub stays a LIVE rung, and S4.6 Stage G attempts the
      workaround — first the diagnosis of why the route has never returned a file (code defect, egress
      block, or corpus miss: the D1/D2 read-only probes of 2026-09-22, jobs/litkb-scihub/), then the
      fronts to the SAME corpus in the order the probes rank them (the sci-hub.* mirrors with the
      client-codebase parser, sci.bban.top, LibGen scimag by DOI, Anna's /scidb, Tor onion if a host
      is unreachable otherwise). A DOI published after the 2022-02-12 freeze is out of corpus by
      construction and is never sent to any of these fronts. Kam, 2026-09-22.
      DIAGNOSED the same evening (two read-only Opus probes D1/D2 under the jobs folder litkb-scihub, and the
      orchestrator's own re-run qc/instruments/litkb_acq_probe_bban.py → phase4/qc/litkb_acq_probe_bban.csv):
      the ledger holds 26 attempts over 22 works, 25 `blocked`, 1 `bad-file`, 0 files; 19 of the 22 DOIs
      post-date the freeze and the 2 eligible ones are confirmed absent — the zero was SAMPLING plus
      MISLABELLING (a miss page booked `blocked`; `blocked` absent from DEAD_STATUSES so every miss was
      retried until sci-hub.ru's ALTCHA rate gate), not a corpus loss. The corpus is open from this
      machine: sci.bban.top served 73/104 (70%) of the pre-2022 no-file backlog on one keyless
      HEAD (D2 measured 73/104, D1 12/20 random; case-sensitive host, suffix upper-cased on 404), LibGen.li's
      json.php→ads.php→get.php chain 75/104, union 77/104. Anna's /scidb, Nexus/STC, library.lol and Tor
      are dead or unaddressed today. The workaround: freeze gate, then bban, then LibGen.li, then the
      sci-hub.* mirrors with three code fixes (S4.6 Stage G).
    why: >-
      Parked removes one probe and one 403 per hunt from a route that has only ever produced
      blocked rows; live keeps the standing grant intact in case a mirror starts answering. The
      back-off lands in S4.5 either way; only the default is Kam's to set.
    evidence:
      - Reports/LITKB_EDGES_2026-09-21.md
      - Reports/LITKB_RULED_HUNTS_2026-09-21.md
  - id: litkb-tracker-corrections
    question: >-
      The ruled run admitted works under the registry's authors and years where the tracker's
      claims were wrong (Reports/LITKB_RULED_HUNTS_2026-09-21.md section 4 lists them), found
      rows 177 and 178 with their DOIs crossed in the tracker's own DOI/URL column, and found row
      194's relevance sentence quoting a different page from its ref. Nothing in
      Reports/literature_tracker.csv was edited (the job's brief forbade it). Are the tracker rows
      corrected to the registry's values, the 177/178 pair swapped, and 194's ref re-pointed —
      and by whom, since the tracker is a project document, not a litkb table?
    owner: kam
    status: decided
    decided: "2026-09-22"
    decision: >-
      A CORRECTED COLUMN beside the original: the tracker keeps its claimed author and year as the
      record of what a person believed, and gains a registry-corrected column carrying the values the
      ruled run admitted under; the crossed 177/178 DOIs are a data error, not a belief, and are fixed
      in place; 194's ref is re-pointed in the corrected column with its reason. A one-time edit before
      S5's first run. Kam, 2026-09-22, verbatim: "litkb-coverage-definition: B, litkb-institutional-access:B litkb-shadow-hosts:a,b,c,d litkb-tdm-keys:Keys for both litkb-s47-colab-queue: You can use as much T4 time as you need, its cheap. I accept the rest of the reccomendations"
    why: >-
      The tracker's claims are the drop-offs' priors; a wrong prior contradicts forever.
      Correcting the tracker makes the register's E23/E24 carriers match their source rows;
      leaving it keeps the admissions' discrepancy rows as the record of the disagreement, which
      is also defensible. Either way the answer is a rule the next tracker-driven run follows.
    evidence:
