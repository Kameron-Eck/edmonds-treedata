# decisions.yaml — the AUTHORED registry of open decisions.
#
# WHY THIS EXISTS. The decision stack lived as eight prose bullets in WORKPLAN.md:
# no dates, no owner, no dependency structure, and no way for a session to tell that
# the 36-run gate is downstream of the champion designations. A session could read the
# board and still not know what is actually blocked on Kam versus on compute.
#
# WORKPLAN.md now POINTS here (one fact, one home). The board keeps intent; this file
# keeps the decisions themselves, queryable via `py -3.12 qc/ask.py --decisions`.
#
# Fields:
#   id           short kebab slug, stable — other entries reference it in `blocked_by`
#   question     the decision, phrased so a yes/no or a choice answers it
#   owner        kam | claude | either — who can actually make the call
#   status       open | decided | superseded | dropped
#   blocks       ids or work this decision gates (nothing here starts until it lands)
#   blocked_by   ids that must land first — the dependency edge
#   why          what changes depending on the answer; the cost of not deciding
#   evidence     tracked pointers a decider should read first
#   decided / decision   filled in when it lands; both or neither
#
# Gated by qc/test_decisions.py: ids unique, statuses closed, links resolve, no cycles,
# every pointer exists, decided entries carry a date AND the decision text.

decisions:
  - id: synthesis-session
    question: >-
      Sit down with the full evidence table and set the story: what does the project
      claim about Edmonds canopy direction, at what confidence, in what order.
    owner: kam
    status: open
    blocks: [city-statement, paper-scope]
    why: >-
      Every downstream artifact (the city statement, the paper, the forward-monitoring
      recommendation) is a rendering of one narrative that has not been fixed yet.
      Writing any of them first means writing them twice.
    evidence:
      - experiments/INDEX.md
      - phase4/qc/year_scoreboard.md
      - Reports/LIT_HUNT_DIGEST_2026-09-06.md

  - id: k4-signoff
    question: >-
      Sign off or amend the documented findings block — review corrections, bootstrap
      CIs, canopy definition §6 and §7, the trend8 and overlap verdicts.
    owner: kam
    status: open
    blocks: [paper-scope, city-statement, thirtysix-run-go]
    why: >-
      Five registry entries sit at status needs-kam with null verdicts because their
      results are documented but unsigned. Until this lands they cannot be cited, and
      the registry deliberately refuses to write a verdict the record cannot support.
    evidence:
      - experiments/INDEX.md
      - Reports/FINDINGS_LEDGER_2026-09-03.docx

  - id: k1-labelling
    question: >-
      Label the redrawn 250-point 2016 sample (~15 min at the measured pace), then
      decide K2 blind repeats and the K5 era choice.
    owner: kam
    status: open
    blocks: [ccap-bias-quantification]
    why: >-
      It is the only route to an Olofsson absolute-accuracy estimate, and zero of the
      drawn points are labelled — the sampler is repaired and idle. The binding
      constraint measured in accuracy_sample_design is interpreter effort, not n.
    evidence:
      - experiments/accuracy_sample_design.yaml
      - qc/instruments/phase4_accuracy_sample.py

  - id: ccap-bias-quantification
    question: >-
      Adopt a two-parameter C-CAP correction, or keep C-CAP strictly as a bounded
      comparator that is never a level authority.
    owner: kam
    status: open
    blocked_by: [k1-labelling]
    why: >-
      C-CAP is the reference nearly every score in the project is measured against, and
      its bias is MIXED-SIGN — it over-calls shrubs and hedges while excluding isolated
      trees by definition. Neither limb has been measured, so no correction can be
      one-parameter. Kam's standing position is that C-CAP overestimates.
    evidence:
      - experiments/ccap_mixed_sign_bias.yaml
      - Reports/CANOPY_DEFINITION_DECISION_2026-08.md

  - id: champion-designations
    question: >-
      Name a champion arm for the 20 acquisitions that have none, or state which are
      deliberately out of scope.
    owner: kam
    status: open
    blocks: [thirtysix-run-go]
    why: >-
      pipeline/champion_arms.csv is the machine-readable answer to "which arm is the
      deliverable for year Y", and it covers 17 of 37 acquisitions. Until it is
      complete, the coverage map cannot distinguish deliberate scope from an oversight,
      and STATUS withholds numbers for undesignated years.
    evidence:
      - phase4/qc/coverage_map.md
      - pipeline/champion_arms.csv

  - id: thirtysix-run-go
    question: >-
      Go/no-go on the full-archive run, plus the recipe sign-off: reconcile 34 vs 36
      arms, and choose per-year NIR/lidar-input recipes versus one uniform recipe.
    owner: kam
    status: open
    blocked_by: [champion-designations, k4-signoff]
    why: >-
      The largest single compute commitment left. full_archive_e3.yaml holds 34 arms
      against a claim of 36, and that discrepancy has never been reconciled — launching
      before it is means not knowing what was launched.
    evidence:
      - experiments/full_archive_e3.yaml
      - experiments/tier1_science_sample.yaml

  - id: city-statement
    question: >-
      Approve the city-facing statement: the two-leg trend, the hot-spot atlas, and the
      framing that the policy gap is 2.6 pp and no instrument could see it until now.
    owner: kam
    status: open
    blocks: [forward-monitoring]
    blocked_by: [synthesis-session, k4-signoff]
    why: >-
      This is the deliverable the whole project exists for — telling the city which
      direction the canopy is heading. It is outward-facing and effectively
      irreversible once sent.
    evidence:
      - phase4/qc/panel_a_estimate.txt
      - phase4/qc/trend8_hotspots.csv

  - id: paper-scope
    question: >-
      Fix the paper's scope: a methods paper built on pre-registration, measured
      controls and the inconsistency decomposition, with the gap claim now hunted.
    owner: kam
    status: open
    blocked_by: [synthesis-session, k4-signoff]
    why: >-
      The overnight hunt established that no published study maps wall-to-wall from a
      heterogeneous sub-meter archive over five-plus epochs, measures its own
      inconsistency, and validates change against blind human truth. That gap is the
      paper's claim to novelty and it is now evidenced rather than asserted.
    evidence:
      - Reports/LIT_HUNT_DIGEST_2026-09-06.md
      - experiments/lit_hunt_temporal_inconsistency.yaml

  - id: forward-monitoring
    question: >-
      Which forward-monitoring regime to recommend to the city: a repeat-lidar cycle,
      vendor-locked capture, annual 15-minute point panels, or a combination.
    owner: kam
    status: open
    blocked_by: [city-statement]
    why: >-
      The archive's hardest lesson is that uncontrolled capture makes trend nearly
      unmeasurable; the recommendation is how the city avoids repeating it. The
      measured inputs already exist — the same-flight floor, the operating-point
      decomposition, and the paired-panel power curve.
    evidence:
      - experiments/sameflight_floor_c3.yaml
      - experiments/overlap_floor.yaml
      - phase4/qc/paired_change_power.csv

  - id: change-detector-build
    question: >-
      Green-light the change-detector build: gold-set freeze, certifier port with the
      three audit fixes, tiers, then bounded temporal backfill.
    owner: kam
    status: open
    why: >-
      Designed and adversarially reviewed, with pass/kill numbers prototyped; 1-2 days
      of CPU. It is the piece that turns per-year masks into defensible change, and it
      is queued behind nothing except the decision to start.
    evidence:
      - Reports/CHANGE_DETECTOR_DESIGN_2026-09-06.md
      - experiments/change_detector_design.yaml

  - id: augmentation-seeding
    question: >-
      Seed the augmentation stream — pass an explicit seed to every albumentations
      Compose and re-baseline every arm — or leave it unseeded and treat each run as
      ONE DRAW, which then requires same-commit replication before any single-run
      number may be read as a verdict.
    owner: kam
    status: open
    blocks: [selection-metric-calibration]
    why: >-
      core.py builds all four dataset Composes (_make_spatial_transform,
      _make_pixel_transform, _make_pixel_transform_nonorm, _make_test_transform) with
      no `seed=`, so albumentations 2.x self-seeds each one from OS entropy per
      process; _seed_everything and _worker_init never reach it. Two SemanticDataset
      objects seeded identically inside one process differ in 1,035,887 of 1,048,576
      pixels on the first item, and same-tile 2017k runs at three commits vary 6.4% at
      epoch-1 train loss and 27% at epoch 2 (referee measurement 2026-09-08 from the
      train logs; no tracked instrument yet). So the train log's
      `Seeds: python/numpy/torch(+cuda) = 42` line and run_passport's `seed` column
      both overstate what is controlled, and qc/bench.py pins the augmentation RNG
      itself — it calls `Compose.set_random_seed(SEED)` on the dataset's own transforms
      before the bench runs, under a comment saying the globals do not reach them —
      which makes BENCH MATCH a null verdict on run-to-run reproducibility, not a
      confirmation of it. This is Kam's call and not a machinery fix, because passing
      a seed moves training numerics for
      EVERY year and re-baselines every arm; leaving it unseeded costs nothing today
      and makes every unreplicated single-run comparison unreadable.
    evidence:
      - pipeline/phase4seg/core.py
      - qc/bench.py
      - phase4/qc/run_passport.csv

  - id: selection-metric-calibration
    question: >-
      Keep the val_iou_bt early-stop / best-checkpoint metric and carry
      WEAK_CALIBRATION into every arm's verdict, or add a calibration term or a
      fixed-threshold guard to selection AFTER the campaign, with a re-baseline.
    owner: kam
    status: open
    blocked_by: [augmentation-seeding]
    why: >-
      Selection maximises IoU at a FLOATING threshold off the 0.1-0.8 grid
      (`es_metric = "val_iou_bt"` in core.py, chosen epoch published by
      phase4seg/select.py::_finish_selection), so a run whose probabilities compress
      upward still scores well and nothing in the metric can see it. The 2017 (5 cm)
      arm heal_2017 selected Phase-A epoch 7 on val_iou_bt 0.7186 at threshold 0.4
      while val_iou at 0.5 had collapsed to 0.2618; Phase B at LR_PHASE_B never
      recovered, and the deployed raster read maxprob 0.701 / p99.9 0.520 —
      WEAK_CALIBRATION under queue_verify's shape check — against 0.862 / 0.614 and OK
      on the 09-05 run of the SAME arm, which selected on a margin of 0.0010, 5-12x
      smaller than the same-epoch spread between runs. That 09-05 run showed the same
      floating-versus-0.5 gap at its own late epochs, so compression is a property of
      the 5 cm recipe and predates every 2026-09-07/08 commit (referee measurement
      2026-09-08 from the train logs and the VERIFY output; no tracked instrument
      yet). Changing the metric mid-campaign breaks heal_infill's RECIPE DISCIPLINE
      clause, and matched cuts already absorb threshold shift; not changing it means
      every 5 cm arm carries a calibration caveat into its verdict. It waits on
      augmentation-seeding because a metric change cannot be A/B tested against a
      stream that redraws itself every run.
    evidence:
      - experiments/heal_infill_2017_2023.yaml
      - pipeline/queue_verify.py
      - pipeline/phase4seg/select.py

  - id: canopy-floor
    question: >-
      Does the deliverable's canopy class have a minimum tree height, below which a
      woody-looking pixel is shrub, not canopy?
    owner: kam
    status: decided
    decided: "2026-09-12"
    decision: >-
      Yes. Small trees of about 2 m are not canopy for this deliverable ("Thats akin to
      shrub and doesnt provide canopy services"). The mask adopts the lidar
      certification floor already in use for change rates (h >= 5 m) unless Kam sets a
      different value. Consequences are worked through in the source section, not here.
    why: >-
      Every downstream measurement that needs a "real tree" size threshold — the
      target-erasure radius (framework §20, ledger row 22), the growth stratum, the
      certified populations' boundary — was undefined without this call.
    evidence:
      - Reports/FRAMEWORK_GAPS_SPATIOTEMPORAL_CONSISTENCY_2026-09-11.md
      - qc/instruments/harm_change_laundering.py

  - id: litkb-p0-foundation
    question: >-
      Which of the literature knowledge base design's P0 decisions (design doc §15) block
      the foundation, admission and migration phases (P1–P3), and how are they answered?
    owner: kam
    status: decided
    decided: "2026-09-13"
    decision: >-
      §15.1 server: PostgreSQL 18 on port 5433. §15.7 promotion: the orchestrator runs
      promote commit after it sees Kam's merge commit on main; the promote tool refuses a
      commit that is not reachable from main. §15.12 backup: a nightly pg_dump of the
      database records (no PDFs, no derived artifacts) is in scope. §15.13 manual
      admissions: signed off by a second agent session; the database refuses an
      approver session equal to the admitter's. §15.15 year tolerance: ±1 year allowed only when the title and
      first author both match the registry record; otherwise the year must match exactly.
      §15.5 (answered later the same day): Unpaywall uses Kam's email, held only in the
      untracked settings file D:\edmonds-pipeline\secrets\paper_search.env; optional source
      keys left blank until Kam asks for them. §15.14: files refused at binding wait for OCR
      in P4; no manual admission for them. Storage: the litkb database lives in a Postgres
      tablespace on D:\edmonds-pipeline\ (C: had about 2 GB free); the server stays put.
      §15.2 ordering: P1 waits until the C++ Build Tools and pgvector are installed (Kam
      declined starting P1 without pgvector). After the P1 referee
      (Reports/LITKB_P1_REFEREE_2026-09-13.md): D-2 a chain held back at promote commit is
      rebased into a fresh open workstream on main's current version and promoted after
      review, never left stuck; D-3 the database cannot run git, so only the orchestrator's
      promote tool holds the promoter credential and §15.7 reads "the promote tool refuses";
      D-4 a manual admission's approver needs only a different session (agent names are
      client-supplied labels); D-9 §9 is reworded: the test login may open Postgres's empty
      system databases, and the property that counts is that litkb refuses it. After the
      second P1 referee (Reports/LITKB_P1_REFEREE2_2026-09-13.md): E-5 a rebase copies only
      the evidence attached to the held chain's head version, exactly as promotion carries
      it, with every copied column checked; the two permission gaps close before P2 — each
      workstream gets a secret token its session must present, and a separate ingest role
      owns extraction runs and set_current_run; the secrets folder ACL stays as it is
      (accepted risk on a one-user laptop). After P1 acceptance (Kam, same day): all
      literature work runs LOCALLY on this laptop, CPU first, optimised as needed; no Colab
      pass, so §15.4 and §15.10 are moot for this workstream and §15.11 is answered (no PDFs go
      to Drive). §15.9: GROBID runs locally, which needs WSL2 or Docker (setup pending). The
      nightly pg_dump is to be built, and so is the ladder check that refuses staged secrets.
      Standing intent: any literature used by the project flows through this knowledge base.
    why: >-
      P1 builds the version pointers, promotion functions and roles that §15.7 and §15.13
      constrain; P2's admission check needs the §15.15 year rule; §15.12 decides whether
      the one store of use histories and approvals has any copy.
    evidence:
      - LITERATURE_KB_DESIGN_2026-09-13.md
