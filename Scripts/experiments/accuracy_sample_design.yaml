name: accuracy_sample_design
kind: measurement-campaign
status: complete
retrospective: true
category: truth
tags: [olofsson, stratified-sample, photo-interp, design-power, reference-disagreement, k1]
hypothesis: >
  Every accuracy number in this project is scored against a reference that is itself a
  product — C-CAP, or an NDVI+CHM rule — and the two of them disagree over a large
  minority of pixels, replicated across four years and three sensors, so it is not
  vintage drift. Inside that contested zone no proxy can adjudicate: the corrected-label
  experiment lifted recall by adopting the NDVI reference's canopy DEFINITION, and
  whether that made the model more CORRECT or merely more LIBERAL is exactly the
  question a proxy cannot answer. A stratified, photo-interpreted human sample with
  Olofsson error-adjusted estimators is the only instrument in the pipeline with no
  model and no proxy product between the analyst and the answer. What would change our
  mind: a power analysis showing the drawn design cannot separate the two candidate
  canopy definitions at the n actually drawn, or strata that spend the sample on ground
  both references already agree about and therefore buy no adjudication at all.
arms: []
baseline: null
metric: >
  phase4/qc/design_power_{2016,2022n,2023n}.txt and .csv — the expected CI of the design
  AS DRAWN (real stratum weights, real allocation, Monte-Carlo studies), swept over
  interpreter error, with the separation between the two candidate canopy definitions in
  the same file. These files describe the kits as they stood BEFORE the 2026-09-04 repair
  and redraw; the redrawn 2016 kit's power has no tracked home (see verdict). Kits and
  their stratum weights: phase4/qc/
  sample_{year}_meta.json; point tables: phase4/qc/sample_{year}.csv. There is no
  estimate output — the Olofsson estimator lives behind `--step estimate` and has
  never been run, because no labels file exists.
decision_rule: >
  RECONSTRUCTED (retrospective: true) from the instrument docstring and from
  qc/instruments/phase4_qc_design_power.py, whose question was posed against the
  2026-08-18 assessment BEFORE any point was drawn — that part genuinely is
  pre-registered. The design commitments: strata cross REFERENCE AGREEMENT with CANOPY
  HEIGHT, not model confidence, because uniform strata would spend the sample on ground
  both references already agree about; every stratum keeps its true area W_h = N_h/N,
  which is what makes the deliberate over-sampling of the contested zone unbiased
  rather than merely convenient; the four confusion cells within a stratum are ONE
  multinomial draw, so the CI carries the full covariance and not the sum of variances;
  `unsure` is a first-class answer, EXCLUDED from estimation and never coerced, the same
  three-state discipline as the mask labels (CLAUDE.md 3.6). The publication rule the
  campaign exists to enforce: mask-derived areas are labelled MAP AREA, and nothing is
  published as an area ESTIMATE until it carries the adjusted estimator and its CI
  (docs/STATS_CHECKLIST.md section 8). The design is admissible only if the measured
  power says it can tell the two candidate canopy definitions apart at the drawn n.
verdict: >
  THE DESIGN HOLDS, THE BINDING CONSTRAINT IS THE INTERPRETER RATHER THAN n, AND NO
  ESTIMATE HAS EVER BEEN PRODUCED. Read from phase4/qc/design_power_2016.txt, which is
  the PRE-redraw 2016 kit: at zero interpreter error that design returns a 95% half-width
  of +-1.22pp against an 8.24pp separation between the two candidate canopy definitions,
  and the same file's sweep degrades to `marginal` by 10% interpreter error — its own
  one-word verdict is CONDITIONAL. The 2026-09-04 redraw's power, +-1.87pp, is recorded
  only in Scripts/CHATLOG.md — no design_power file exists for the redrawn kit — and it
  does not flip the read, because 1.87pp still sits well inside the 8.24pp separation
  reported at phase4/qc/design_power_2016.txt:31. That inverts the premise carried in the
  docstring of Scripts/qc/instruments/phase4_qc_design_power.py, which records the
  2026-08-18 assessment as computing +-5.9pp under simple random sampling and concluding
  the sample could not arbitrate — note that design_power_2016.txt:32 records the SRS
  half-width the assessment assumed as +-0.0620 (6.20pp), so the two figures may be
  different quantities rather than one contradicting the other, and this entry does not
  adjudicate which. Either way sample size was never the binding constraint, interpreter fidelity is,
  which is why the
  duplicate-interpreted subset stopped being optional. The 2026-09-03 ledger audit
  surfaced four defects in the machinery, and the 2026-09-04 repair pass
  (Scripts/CHATLOG.md, `accuracy-batch-overnight`) closed them: strata rebuilt on chm2
  instead of the deprecated CHM raster that reads high, the undo-as-final-row bug in
  `--step estimate` fixed, the 2016 and 2023n kits redrawn after 2023n was found to be a
  byte copy of 2022n, and the frozen-model-snapshot defect retired by U1, which scores
  ANY arm at the labelled points rather than the snapshot each kit froze. What remains
  absent is the campaign's own deliverable: no labels file exists, therefore no Olofsson
  estimate, no error-adjusted area, no CI. That is the honest read — the machinery is
  complete and gated, the number is not, and K1 (Kam labelling the redrawn 250-point
  2016 kit) is the only gate between them.
decided: 2026-09-04
design_doc: Scripts/docs/STATS_CHECKLIST.md
instruments:
  - Scripts/qc/instruments/phase4_accuracy_sample.py
  - Scripts/qc/instruments/phase4_qc_design_power.py
  - Scripts/qc/instruments/build_sample_covariates.py
outputs:
  - phase4/qc/sample_2016.csv
  - phase4/qc/sample_2016_meta.json
  - phase4/qc/sample_2000.csv
  - phase4/qc/sample_2022n.csv
  - phase4/qc/sample_2023n.csv
  - phase4/qc/design_power_2016.txt
  - phase4/qc/design_power_2016.csv
  - phase4/qc/design_power_2022n.txt
  - phase4/qc/design_power_2023n.txt
reports: [Reports/FINDINGS_LEDGER_2026-09-03.docx]
imagery: ["2016", "2000", "2023n"]
sample: >
  stratified photo-interpretation kits over the decimated analysis lattice, one kit per
  year, 250 points each. Years with NIR use the dual-reference scheme (six strata
  crossing C-CAP/NDVI agreement with canopy height); years without fall back to four
  strata on C-CAP class crossed with height, because there is no disagreement to
  adjudicate. The pinned n is the 2016 kit.
n: 250
n_source: phase4/qc/sample_2016.csv#rows
supersedes: []
superseded_by: []
