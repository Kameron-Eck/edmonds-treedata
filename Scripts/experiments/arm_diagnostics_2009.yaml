extra:
  reads_from: >
    each arm's probability raster in the lake (phase4/masks/) against the epoch-matched
    C-CAP reference — lake paths, not gated here. The common-footprint pixel counts these
    files report line up with the valid column of phase4/qc/qc_indep_report.csv, which is
    the tracked cross-check, not an input.
  scope_note: >
    this entry owns the DIAGNOSTIC MACHINERY and the floors it measured, on the
    fullext-versus-3-band contrast. The label-variant verdicts computed with the same
    instruments on the same year — the sparse-groves and quadrants/Node-C arms — belong
    to stability_mining_closure, which is where their readings are recorded. Shared
    pointers, separate verdicts.
  crown_layer: >
    D:\edmonds-pipeline\backup\inference\edmonds_crowns_2020.gpkg (local path, not
    gated). It descends from the same 2020 hand annotations as the training key, so the
    independence is at the LABEL-PATHWAY level, not total.
  provenance_gate: >
    each arm's recipe was read from its own run manifest rather than from a tag list,
    confirming no add-canopy overlay contaminated the held-out crown layer. The two
    manifests are lake paths recorded in Reports/CROWN_TOUCH_2009.md.
  filename_caveat: >
    two of the 2009 diagnostic files carry an instrument's boilerplate header rather than one
    matching their name — seed_area_noisefloor_2009.md is a region-confusion-format table
    over the three seed arms, and holdout_design_census_2009.md (not listed) carries the
    bootstrap header. Read the table, not the title.
  instrument_paths: >
    the reports' footers cite the pre-reorganisation locations (qc/phase4_crown_touch.py);
    the instruments now live under Scripts/qc/instruments/ and that is what is pointed at
    here.
