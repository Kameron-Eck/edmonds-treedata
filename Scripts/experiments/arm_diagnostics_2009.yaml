sample: >
  one calendar year, several arms scored on a single common valid footprint (the
  intersection of every arm's valid pixels with the scorable C-CAP reference), plus a
  crown-level view over the phase-0 2020 crowns that fall wholly inside that footprint.
  The replicate set behind the floor is five same-seed reruns; the bootstrap resamples
  fixed pixel blocks, paired across arms.
