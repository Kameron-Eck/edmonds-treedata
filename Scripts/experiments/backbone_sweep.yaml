  kam_decision_2026_09_09: >
    KAM, 2026-09-09, on extra.phase2_result_pending_kam: "move forward with using resnet
    18 to refine the recipe." READ AS OPTION (i): resnet50 from the base50 start is
    accepted on (a) the absolute gap, (b) the seed spread and the null pair, and recipe
    refinement now moves DOWN to resnet18 — PROVIDED the resnet18 phase-2 check holds the
    way resnet50's did: (a) at or above the resnet101 record at the held cut
    (matched_p75 recall, phase4/qc/backbone_benchmark.csv), (b) its own three-seed spread
    comparable to the 101's 0.0085 (the pre-registered "within 2x"), and the null pair
    (wb18_2011s_cor05 minus wb18_2011s_base) inside that floor. If any of the three fails,
    recipe search does NOT move to resnet18 and the failure is recorded here.
    WHAT THIS GATE DROPS, stated plainly: the pre-registered (c) also required the
    POSITIVE pair (2016 in05 minus base) to clear the encoder's floor with the 101's sign.
    resnet50 did not meet it and this decision does not require resnet18 to. The reason is
    the reference arm, not the small encoder — the 101's t1_2016_base (0.669) was recorded
    suspect-low on 2026-09-03 while every warm-started encoder lands at the ~0.751 ceiling.
    THE 2016 LIDAR EFFECT THEREFORE STAYS **UNRESOLVED**, not disproven: it cannot be read
    until the 101's 2016 base is reseeded, which is already on the board. No verdict is
    written for this experiment on the strength of the positive pair either way.
    The older extra.phase2_warm_started sentence ("ResNet-18 phase 2 runs ONLY if resnet50
    passes rank agreement (c)") is the pre-decision record; this note supersedes it.
