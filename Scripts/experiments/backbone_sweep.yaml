name: backbone_sweep
kind: experiment
status: complete
retrospective: false
category: machinery
tags: [backbone, encoder, resnet18, resnet50, recipe-search, tier1-sample, loso]

hypothesis: >
  Recipe rankings measured on a small encoder agree with resnet101 within the noise
  floor, so recipe search (the dozens of label/input/loss knobs still open after
  Tier-1) can move to the small encoder and resnet101 is reserved for confirmation and
  deliverables. The nine Tier-1 arms in phase4/qc/backbone_benchmark.csv are the
  reference: five base years, the 2011s three-seed floor, one CONFIRMED-POSITIVE pair
  (2016 in05 vs 2016 base, lidar input, the largest of the 3/3 confirmed deltas in
  tier1_results.csv) and one NULL pair (2011s cor05 vs 2011s base, the flat corruption
  dose inside the floor). Each is re-run on resnet18 and resnet50 with everything else
  held: same tiles recipe (--force-citywide --sample-manifest, no hillshade except the
  in05 arm's chm2005 band 4), same decoder (config.DECODER_CHANNELS), same epoch
  budgets, same seeds. What would change our mind: the positive pair failing to read
  positive, or the null pair reading positive, against the encoder's OWN three-seed
  floor — then the small encoder cannot be trusted to rank recipes and search stays on
  101. STATED CONFOUND (config.py, ENCODER AS A RUN FLAG block): every resnet101 arm
  warm-started from the Phase-3 2020 base — a 2020-trained encoder AND decoder — while a
  resnet18/50 arm has no such base and starts from ImageNet encoder weights with a
  random decoder (warm_start stamp: p3_ckpt vs imagenet). Question (a) below therefore
  measures encoder PLUS warm start; (b) and (c) are within-encoder reads and do not
  carry that confound. A resnet101-from-ImageNet control arm would separate the two and
  is recommended before (a) is read as an encoder effect.

