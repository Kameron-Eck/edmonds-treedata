    no hillshade except the in05 arm's chm2005 band 4.
    LOAD PATH, MEASURED LOCALLY 2026-09-09 against the lake copy of sem_best_2020_base18.pt
    (NOT copied from the base50 note — these are resnet18 numbers): ckpt.build_model with
    ENCODER=resnet18 gives a 182-key U-Net; ckpt.load_state_into loads the checkpoint into
