# --force-citywide: polygons/ was overwritten with accept-all test data (CLAUDE.md §4);
# every Tier-1 arm carried it and queue_verify refuses a fine-tier job without a label
# source. Steps stop at evaluate on purpose — see decision_rule, "second queue shape".
launch_defaults:
  - --force-citywide
steps: [labels, tile, train, evaluate]

baseline: phase4/qc/backbone_benchmark.csv (the nine t1_* arms on resnet101)

metric: >
  PRIMARY: LOSO sample-test recall at held precision 0.75 (policy matched_p75) per arm,
  from phase4/qc/arm_metrics.csv rows with ref ccap_2021_hires_lc.tif, canopy_def
  forest_wetland, eval_scope sample-test — the identical basis as the resnet101 rows in
  phase4/qc/backbone_benchmark.csv. Deltas are read arm minus its resnet101 twin, and
  pair deltas within an encoder (in05 minus base; cor05 minus base). COST: wall-clock
  minutes per step from the per-launch train_queue_status_*.csv ledger (column minutes)
  and the step logs under phase4/logs/; peak GPU memory from the raw hw_{session}.csv
  telemetry (gpu_mem_used_mb, sliced by the run_tag column of the v2 schema) — no
  per-arm peak column exists yet and one must be harvested, not typed. SECONDARY:
  best_f1 rows of the same population; the circular semantic_eval_report.csv row is
  recorded (it now carries encoder + warm_start) but is never the headline.

decision_rule: >
  PRE-REGISTERED, before any arm has run. Three questions, answered per encoder.
  (a) ABSOLUTE GAP: for each of the nine arms, small-encoder recall@p75 minus the
  resnet101 row of backbone_benchmark.csv. Reported as a table with the encoder's own
  floor beside it; a gap inside the floor is UNDETERMINED, never "no difference". This
  number carries the warm-start confound stated in the hypothesis and is reported as
  encoder-plus-warm-start until a resnet101-from-ImageNet control exists.
  (b) SEED SPREAD: the encoder's own floor = max pairwise |delta| of recall@p75 among
  bbNN_2011s_base, _s2, _s3, compared with the resnet101 spread row of
  backbone_benchmark.csv (NOISE_FLOOR_2011s / spread / matched_p75). "Comparable" means
  within 2x; a floor above 2x the reference says the small encoder is too noisy to rank
  recipes at this sample size, regardless of (c).
  (c) RANK AGREEMENT — the licensing question: the positive pair (bbNN_2016_in05 minus
  bbNN_2016_base) must exceed the encoder's own floor from (b) with the SAME sign as
  resnet101, and the null pair (bbNN_2011s_cor05 minus bbNN_2011s_base) must fall
  inside it. If (c) holds for an encoder, recipe search is LICENSED on that encoder,
  with resnet101 reserved for confirmation runs and deliverables; if it fails, search
  stays on resnet101 and the failure mode (missed positive vs false positive) is
  recorded. Two encoders can license independently; the cheaper one that passes wins.
  SECOND QUEUE SHAPE: the primary metric needs the Phase-B2 inference over the sample
  blocks (--infer-aoi science_sample_blocks.gpkg WITHOUT --sample-manifest, the Tier-1
  commit ac0e79e shape), then qc/phase4_qc_indep.py scoring on the LOSO test blocks and
  a harvest_arm_metrics re-run. Per-step flags are impossible in one queue job, so that
  is a follow-up queue generated from this file with steps [inference]; (a)-(c) are not
  readable before it runs. CANARY: each launch file runs a distinct-tag, 1+1-epoch copy
  of the 2006s base arm FIRST (canary_bb18_2006s_base / canary_bb50_2006s_base) so one
  full labels->tile->train->evaluate cycle lands under --encoder before the nine arms
  spend; the canary's numbers are plumbing evidence only and are never scored.
  GPU: the 2-concurrent-A100 cap; one queue file per A100.
  PHASE 2 (added 2026-09-09, before any wb50 arm ran): the warm-started wb50_ arms are
  the read that counts for (a), (b) and (c) — they start from the encoder_bases base50
  checkpoint, so (a) is an encoder comparison without the warm-start confound stated
  in the hypothesis. The bb50_ rows remain the ImageNet-start record. Phase-2 launch
  files carry NO canary: --encoder and the labels->tile->train->evaluate cycle were
  proven by phase 1, and the --ckpt load path is the engine's ordinary p3_ckpt route.

verdict: >
  DECIDED 2026-09-10 on Kam's gate (extra.kam_decision_2026_09_09): RECIPE REFINEMENT
  MOVES TO RESNET-18, warm-started from phase4/models/sem_best_2020_base18.pt. The
  pre-registered metric (matched_p75 recall vs C-CAP 2021 on the LOSO sample-test
  blocks; phase4/qc/arm_metrics.csv joined to backbone_benchmark.csv), resnet18 (base18
  start) vs the resnet101 record: 2011s base/s2/s3 0.720/0.725/0.727 vs 0.725/0.720/
  0.717 (SEED SPREAD 0.0069 vs 0.0085); cor05 0.727 vs 0.725; 2016 base 0.743 vs
  0.669; 2016 in05 0.751 vs 0.744; 2020 base 0.740 (P 0.753) vs 0.640 (P 0.800). AP
  0.803-0.830 vs 0.755-0.820. (a) at or above the 101 on every arm; (b) noise better
  than the 101's; null pair +0.006, inside the floor. Positive pair +0.008 (inside the
  floor) — as on resnet50, the 101's +0.075 lidar-input effect does not reproduce with
  a sound baseline; the 2016 lidar effect stays UNRESOLVED pending the 101's 2016
  reseed. Against resnet50 (base50 start): resnet18 is ~0.03 lower on 2011s, equal on
  2016, higher on 2020; train 14-31 min vs 14-30 (both ~25-35% under the 101; the
  pipeline is I/O-bound, so the small encoder's saving is in fine-tune minutes, not
  inference). Phase-1 (ImageNet-start) arms stand as the record of why a trained base
  per encoder is required. Cache fix (0080cce) validated live twice (in05 inference on
  both encoders).
decided: '2026-09-10'

instruments:
  - Scripts/qc/instruments/backbone_benchmark.py
  - Scripts/qc/instruments/harvest_arm_metrics.py
  - Scripts/qc/instruments/score_wb50_loso.py
inputs:
  - phase4/qc/arm_metrics.csv
  - phase4/qc/tier1_results.csv
  - phase4/qc/science_sample_manifest.csv
outputs:
  - phase4/qc/backbone_benchmark.csv
imagery: [2006s, 2011s, "2016", 2019n, "2020"]
sample: >
  The Tier-1 ground sample: 33 screened blocks split once (30 test, 2 train, 1
  selection; phase4/qc/science_sample_manifest.csv), the same fixed blocks for every arm
  and every encoder. Train and early-stop on the manifest tiles; scores read from the
  test blocks only. Every arm re-tiles under its own tag (tile_dir_for keys on
  {label}__{run_tag}); the offload pilot measured a re-tile as byte-identical, so the
  tiles are the same set under a new name, at the cost recorded in extra.measured_cost.
n: 30
n_source: phase4/qc/science_sample_manifest.csv#rows:role=test

supersedes: []
superseded_by: []

extra:
  phase2_result_pending_kam: >
    PHASE 2 SCORED 2026-09-09 (the pre-registered metric: matched_p75 recall at held ~0.75
    precision vs C-CAP 2021 on the LOSO sample-test blocks; phase4/qc/arm_metrics.csv,
    eval_scope sample-test, joined to backbone_benchmark.csv). Warm-started resnet50 vs the
    resnet101 record, recall (precision): 2011s base 0.762 (0.752) vs 0.725 (0.750);
    s2 0.751 vs 0.720; s3 0.753 vs 0.717; cor05 0.752 vs 0.725; 2016 base 0.751 vs 0.669
    (0.758); 2016 in05 0.758 vs 0.744; 2020 base 0.678 (0.771) vs 0.640 (0.800). AP within
    +/-0.006 on 2011s/2016, +0.02 on 2020.
    (a) ABSOLUTE GAP: none - resnet50 from the base50 start is ABOVE the 101 on every arm
    (+0.014 to +0.082 recall at the held cut).
    (b) NOISE: seed spread 0.0114 vs the 101's 0.0085 - comparable (1.3x).
    (c) RANK AGREEMENT, as pre-registered: NOT MET on the positive pair. The 101 read 2016
    in05 - base = +0.075 (9x its floor); resnet50 reads +0.0066 (0.6x its floor), i.e. no
    effect. The null pair agrees (-0.010 vs -0.0002, both inside the floor). THE
    DISAGREEMENT SITS IN THE 101'S BASELINE, not in the small encoder: t1_2016_base
    (0.669) was already recorded as suspect-low in the 2026-09-03 plan ("all five 2016
    treatments cluster at the same ceiling"), and resnet50's 2016 base lands at that
    ceiling (0.751), so the lidar-input "gain" on the 101 is consistent with a low
    baseline rather than a treatment effect. The rule as written does not license recipe
    search on resnet50; the evidence says the rule's own reference arm is the doubtful
    one. NEEDS KAM: (i) accept resnet50 (base50 start) for recipe search on (a)(b) and the
    null pair, treating the 2016 lidar effect as UNRESOLVED until the 101's 2016 base is
    reseeded (already on the board), or (ii) hold the rule literally and reseed first.
    ResNet-18 phase 2 stays gated on that decision. Cache fix validated on the in05
    re-run (one stage line, cache hits, no ENOENT).
  phase2_results_evaluate_iou: >
    2026-09-09 20:47Z, seven wb50 arms landed (wb50a: 2011s base/s2/s3/cor05; wb50b: 2016
    base/in05, 2020 base), both runtimes stopped. Evaluate IoU on the held-out test tiles,
    from step logs (phase4/qc/eval_from_logs.csv): 2011s base 0.516 / s2 0.510 / s3 0.517
    (SEED SPREAD 0.0066 - equal to the resnet101 Tier-1 spread 0.0066; the ImageNet-start
    bb50 spread was 0.078); cor05 0.504 (null pair -0.0125 vs base); 2016 base 0.532,
    in05 0.540 (positive pair +0.0078); 2020 base 0.848 vs the 101's 0.895. Train minutes
    14-30 vs 20-37 on the 101 (I/O-bound, ~25-35% faster). READ: (b) noise PASSES with the
    trained start; (a) at or above the 101 on the sample years, below on 2020; (c) rank
    agreement UNDETERMINED at this metric - both pairs read within ~2x the floor for every
    encoder, because evaluate IoU vs projected labels is NOT the pre-registered score; the
    101's +0.075 positive pair is a matched-cut LOSO recall vs C-CAP. The LOSO
    inference+scoring pass on the 33 blocks (steps [inference] + qc/phase4_qc_indep.py
    --aoi, then harvest_arm_metrics) is what decides (c); not yet run for wb50. ResNet-18
    phase 2 stays gated on (c).
  cross_vm_eval_report_clobber: >
    OBSERVED 2026-09-09 05:44Z, first hour of the sweep. Both A100 runtimes rewrite the
    shared phase4/eval/semantic_eval_report.csv on every evaluate (read-modify-write behind
    an rclone write cache whose uploads land asynchronously). bb50_2006s_base wrote at
    05:43:09Z; bb18_2006s_base wrote ~05:44Z and its VERIFY:evaluate read MISSING (a stale
    view still showing t1_2006s_in05); the live file now carries bb50's rows only and
    bb18's rows are in neither the live report nor the superseded archive. NOTHING SCIENTIFIC
    LOST: every evaluate's metrics are in its step log (phase4/logs/phase4_semantic_finetune_
    evaluate_<year>_<ts>.log, e.g. bb18_2006s_base IoU 0.2939 Dice 0.4543 Prec 0.5776
    Rec 0.3744, in-sample at this GSD) and the sweep's primary metric is the LOSO
    sample-test score from the inference+scoring step that follows. CONSEQUENCES: (1) any
    VERIFY:evaluate MISSING/STALE row in this campaign's ledgers is this defect until
    shown otherwise; (2) registry_from_manifests reads held-out metrics from the eval CSV
    and will read the wrong arm's or none for clobbered rows — rebuild those rows from the
    step logs before the registry is trusted for bb arms; (3) the same class as the
    2026-09 ledger erasure, on a different file: the eval report needs per-run files
    (WORKPLAN system-work item 3) before two runtimes share a year again.
  encoders: [resnet18, resnet50]
  reference_encoder: resnet101
  benchmark_arms_source: Scripts/qc/instruments/backbone_benchmark.py#BENCHMARK_ARMS
  measured_cost: >
    Per-step minutes for the resnet101 Tier-1 arms, read from
    phase4/qc/ledger_recovery/train_queue_status_recovered_20260901_20260907.csv
    (a recovered CANDIDATE ledger, docs/SCHEMAS.md) — A100-40GB for train/evaluate,
    free CPU VMs for labels/tile: labels 5-15 min, tile 7-53 min (2020 in05/in16 at
    30-53 min are the slow end; 2006s 7-12 min), train 19-28 min, evaluate 7-36 min.
    At that shape one arm is ~60-90 min end to end, so nine arms plus a canary is
    ~8-12 hours per A100 queue with labels+tile on the GPU runtime, of which
    ~15-40 min per arm is tiling the GPU sits idle for. Train is expected faster on
    resnet18/50 (fewer encoder FLOPs; the decoder is unchanged) — NOT measured yet,
    which is what the wall-clock metric records. The Tier-1 campaign ran labels+tile
    on CPU runtimes first (commit 7ef2f11) and only train+evaluate on the A100s
    (4a04d62); the same split is available here by generating a CPU launch file with
    steps [labels, tile] and launching the GPU files after VERIFY:tile is OK.
  canary_tags: [canary_bb18_2006s_base, canary_bb50_2006s_base]
  phase2_warm_started: >
    ADDED 2026-09-09 (Kam: "Yes to the fewer arms and use TWO gpus"). Seven wb50_ arms
    (three 2011s seeds = floor, 2011s cor05 = null pair, 2016 base + in05 = positive
    pair, 2020 base = absolute gap) re-run the bb50_ recipe warm-started from
    phase4/models/sem_best_2020_base50.pt (experiments/encoder_bases.yaml verdict:
    resnet50, ImageNet start, Phase-3 crown tiles; its numbers live THERE). The 2006s and
