outputs:
  - phase4/qc/timing_events.csv
  - phase4/qc/runtime_sessions.csv
  - phase4/qc/hw_step_attribution.csv
imagery: ["2017k"]
sample: >
  One acquisition, the pilot's own, so every read has a same-recipe counterpart in
  phase4/qc/offload_pilot_2017k.csv. Machinery, not science; no canopy number from this
  run feeds anything.

supersedes: []
superseded_by: []

extra:
  runtime_split: >
    Two hand-split queue files (pipeline/bundle_validation_2017k_cpu1.yaml: labels+tile;
    pipeline/bundle_validation_2017k_gpu.yaml: train), same job id, no GENERATED header
    (the drift test would refuse a split). Launched with `vm_ops launch ... --env
    PHASE4SEG_TILE_BUNDLE=1` once that flag exists on the front door.
  measured_cost: >
    CPU-1 free (0 CU, PUBLISHED). A100 for one train step, ~40 min on the pilot's
    numbers (39.9 min engine, 40.4 queue) plus bootstrap; ~4 CU INFERRED from the
    2026-09-03 balance note (~5.3 CU/h per A100). Authorised under Kam's 2026-09-07
    "full permission to move ahead" and "don't defer to me for permissions".
