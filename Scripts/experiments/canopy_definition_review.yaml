sample: >
  not a point sample — the unit is the DEFINITIONAL KNOB. Every implicit choice the
  running pipeline makes (label convention, NDVI/height cutoff pair, C-CAP class
  set, operating threshold, postproc MMU, denominator, human protocol, scoring and
  resampling conventions) is enumerated, then priced in pp of area from an existing
  measured file wherever one exists.
