extra:
  docx_sections: [EXP-B-CCAP-MIXED-SIGN-BIAS]
  needs_kam_reason: >
    the governing decision document is UNSIGNED — all six of its checkboxes are written
    unticked, verified in the file this session — so the finding has no adopted
    mitigation and is a caveat attached to readings rather than a correction applied to
    numbers. On top of that, neither limb has been measured: the over-call limb is
    recorded explicitly as an observation, and its quantification is queued on the
    WORKPLAN board behind Kam's 250-point 2016 photo-interpretation sample. A verdict
    here would have to state a net sign that no tracked file supports.
  limb_1_over_call: >
    C-CAP paints canopy where none is, so our true negatives there are charged as false
    negatives (recall UNDERSTATED) and our false positives land on painted canopy and
    are credited as true positives (precision FLATTERED). Kam's own observation,
    recorded in the decision document's "stale in the original proposal" block.
  limb_2_stands_not_crowns: >
    C-CAP counts stands rather than individual crowns and excludes isolated trees as a
    matter of kind, so a correctly detected street or yard tree has no reference canopy
    to match and is charged as a false positive — precision UNDERSTATED, on the same
    suburban population limb 1 flatters.
  third_structured_component: >
    crown-edge partial pixels are the third non-random component of reference
    disagreement and are routinely conflated with the two limbs above. It is a property
    of OUR masks, not a C-CAP bias, and belongs in the definition review rather than
    here.
  reading_rule_in_force: >
    the live tracked home of the bounded-comparator rule — C-CAP as the operating-point
    selector only, never the accuracy or trend authority — is the decision_rule of entry
    trend8_uniform_rgb, which is the rule being applied rather than a second statement
    of this finding.
  unverified_upstream: >
    the document's disagreement-magnitude figures are attributed to a CHATLOG result
    that lives on the pre-refactor archive branch and was not read; its cutoff-grid
    percentages are over the 2016 imaged band rather than the city, and the document
    itself flags them as internally comparable but not citywide canopy figures.
