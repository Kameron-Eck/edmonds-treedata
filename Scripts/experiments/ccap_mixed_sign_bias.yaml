name: ccap_mixed_sign_bias
kind: instrument-finding
status: needs-kam
retrospective: true
category: reference
tags: [c-cap, reference-bias, bounded-comparator, canopy-definition, mixed-sign, unsigned]
hypothesis: >
  C-CAP is the reference nearly every score in this project is measured against, and the
  standing temptation is to treat its disagreement with our masks as one-directional —
  "C-CAP over-calls canopy, so our real accuracy is better than the numbers say." It is
  not one-directional. Two documented mechanisms push our metrics in OPPOSITE directions
  and concentrate in the same suburban residential land cover, so they cannot be assumed
  to cancel and their net cannot be signed. What would change our mind: a measurement of
  either limb's magnitude, which would turn a caveat into a correction.
arms: []
baseline: null
metric: >
  no measured home exists, and that is the finding's status rather than an omission.
  Both limbs are recorded as prose in Reports/CANOPY_DEFINITION_DECISION_2026-08.md —
  the over-call limb as Kam's observation with its signed consequence, the
  stands-not-crowns limb as a class-definition property established by the failure of
  the document's whole measured cutoff grid to reach C-CAP's total. Quantification is
  queued on the WORKPLAN board as the Olofsson estimate off the 250-point 2016
  photo-interpretation sample, blocked on Kam's labelling of that sample.
decision_rule: >
  RECONSTRUCTED (retrospective: true) from the governing decision document and the
  board's standing instruction; it is a READING rule, not a pass/fail. C-CAP is a
  bounded comparator, never truth, and no C-CAP-referenced score may be read as evidence
  about our accuracy in EITHER direction. A signed net bias — and any correction factor
  derived from one — becomes quotable only when both limbs have been measured, because
  they act on the same population with opposite signs: over-call charges our true
  negatives as false negatives while flattering our precision, and the stands-not-crowns
  exclusion charges correctly detected isolated trees as false positives, understating
  precision on exactly the population the first limb flatters. Corollary the document
  states in its own right: the disagreement is a difference of KIND, not of degree, so
  no choice of greenness and height cutoffs can reconcile the two references — a
  threshold search for reconciliation is chasing something that does not exist.
verdict: null
decided: null
design_doc: Reports/CANOPY_DEFINITION_DECISION_2026-08.md
imagery: ["2016"]
sample: >
  no sample and no computation — two documented disagreement mechanisms between C-CAP
  and our masks, assembled into one mixed-sign record because separating them into two
  entries would invite quoting either limb as if it were the net.
