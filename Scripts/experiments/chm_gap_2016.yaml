  the two zones of the imaged 2016 footprint — has-CHM and no-CHM — where "imaged" means
  red plus near-infrared above zero, measured on the 2016 four-band ortho decimated 1/8.
  The unit of analysis is the zone; the per-zone pixel counts and NDVI percentiles are the
  measurements.
