name: chm_gap_2016
kind: instrument-finding
status: complete
retrospective: true
category: lidar
tags: [chm, lidar, coverage, ndvi, water, bound, "2016", assumption-check]
hypothesis: >
  Every canopy definition this project uses is "green AND tall", so it needs a height
  value. Where the lidar does not reach, a pixel CANNOT be canopy — it is forced to
  background by absence of data rather than by the definition, which makes every canopy
  figure derived that way a LOWER BOUND. A standing assumption said the uncovered strip
  is the Puget Sound western edge and the southern margin, i.e. water, and therefore that
  the bound is tight and nothing changes. That was plausible and never verified. If the
  uncovered zone instead contains green land, the city canopy number is understated and
  the canopy definition inherits a coverage bias. Water reads strongly negative in NDVI
  and vegetation reads high, so the two zones can be told apart with no model at all.
arms: []
baseline: null
metric: >
  phase4/qc/chm_gap_2016.txt — the coverage split, the NDVI percentile profile of each
  zone with its negative-NDVI share, the green share of each zone at three NDVI cuts, and
  the worst-case bound on understated city canopy. Machine copy in
  phase4/qc/chm_gap_2016.csv, one row per zone.
decision_rule: >
  RECONSTRUCTED (retrospective: true) from the instrument's own docstring, which states
  the reading before the run: "Water is strongly NEGATIVE in NDVI, so a no-CHM zone that
  is genuinely water will show a negative NDVI distribution. Vegetation sits high. The gap
  between those two readings is the answer." Two design commitments make the answer
  admissible. First, the SAME NDVI cuts are applied to both zones, so the has-CHM zone is
  the control that says what green looks like in this imagery rather than a value asserted
  from elsewhere. Second, the bound is DELIBERATELY GENEROUS: every green no-CHM pixel is
  counted as canopy at each cut, even though lawns are green too, so the reported figure
  is an upper bound on the understatement and the truth is lower. The assumption is
  confirmed only if the no-CHM zone is overwhelmingly negative in NDVI AND the generous
  bound is negligible against the canopy figures it would perturb.
verdict: >
  THE ASSUMPTION HOLDS AND IS NOW CHECKED RATHER THAN ASSERTED. The worst-case
  understatement of city canopy from the coverage gap is up to +0.02 pp of imaged area,
  identical at all three NDVI cuts — read from phase4/qc/chm_gap_2016.txt, which carries
  the coverage split and both zones' NDVI profiles in the same file. THAT BOUND WAS
  MEASURED ON A CLIPPED FOOTPRINT AND MUST BE QUOTED THAT WAY: the ortho this instrument
  opened is the file Scripts/pipeline/phase4seg/config.py records as "2016_snoh_rgbi.tif
  (0.5 ft served upsample, 53.4% clip)", replaced 2026-08-23 by the native 1 ft delivery
  whose catalog coverage string in that same file reads "100% of city polygon, 82.3% of
  study extent (measured 2026-08-23; remainder is Puget Sound)". The imaged-pixel
  denominator and the has-CHM / no-CHM split the bound is
  computed over therefore describe the clipped predecessor, not the footprint the catalog
  now resolves to, and nothing has re-measured the bound on the replacement. The mechanism is
  unambiguous: almost the whole no-CHM zone reads negative in NDVI while the has-CHM zone
  reads like a mixed urban-forest scene, so the uncovered strip is water, exactly as the
  standing assumption said. Three bounds travel with this result and none of them is
  optional. (1) It bounds COVERAGE bias ONLY — it says nothing about whether the height
  raster is accurate where it does exist, and that separate question is answered badly for
  the raster this instrument reads: see old_chm_defect. (2) NDVI here is computed on
  decimated, averaged reflectance, so mixed pixels are smoothed and the percentiles are
  indicative rather than exact. (3) Turbid or sun-glinted water can read slightly
  positive, so the negative-NDVI share understates water a little — which pushes in the
  conservative direction for this conclusion. One unreconciled figure is recorded rather
  than smoothed over: the human accuracy sampler's stratum design cites a materially lower
  CHM coverage of the city than this file measures over imaged 2016 pixels. The two use
  different denominators, no tracked file reconciles them, and they must not be averaged
  or quoted as a contradiction.
decided: 2026-08-18
commit: b78fbe2
