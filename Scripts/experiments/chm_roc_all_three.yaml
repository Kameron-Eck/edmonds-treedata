reports: [phase4/qc/CHM_STANDALONE_PRIOR_2026-08-29.md]
sample: >
  the common valid footprint of all six height arms intersected with the reference,
  on a 1 m analysis grid in EPSG:26910 snapped to the reference lattice; resampled as
  non-empty 512 x 512 px (512 m) spatial blocks, 400 paired bootstrap replicates. The
  unit of analysis is the BLOCK, not the pixel — neighbouring pixels are the same tree.
