sample: >
  the common valid footprint of the chm / chm2 dilation ladder intersected with the
  reference, on a 1 m analysis grid in EPSG:26910; resampled as non-empty 512 x 512 px
  (512 m) spatial blocks, 400 paired bootstrap replicates. The unit of analysis is the
  BLOCK. This run's footprint is LARGER than the all_three run's because fewer rasters
  intersect — the reason cross-run comparison is forbidden.
