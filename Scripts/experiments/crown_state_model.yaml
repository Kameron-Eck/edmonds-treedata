extra:
  why_crowns_first: >
    A crown pools a few hundred cells into one vote per year, so boundary jitter and
    sub-cell registration error cancel before the model sees them; the pixel version is
    the same model with noisier input and no gold of its own. Crowns are a 2020 snapshot:
    trees removed before 2020 or planted after have no polygon and are invisible to this
    layer — the pixel version, if the crown one promotes, is where that is recovered.
  relation_to_healer: >
    The healer's HEAL / REVIEW / BLIND tiers are a discrete stand-in for emission rates
    plus a gap-length prior. temporal_heal.py::tier_for grants HEAL only with a lidar
    epoch downstream, so post-2016 it writes IGNORE and never canopy (heal_infill reads,
    2026-09-10). The state model has no such gate; its post-2016 assertions are bounded
    by the rates instead, which is exactly what K1-K3 test.
