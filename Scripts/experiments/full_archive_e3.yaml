metric: >
  qc_indep_report.csv live=1 rows per arm (vs ccap_2021_hires_lc), the dense
  sweep files qc_indep_sweep_{year}_{tag}_*.csv, and the policy-C registry
  phase4/qc/indep_thresholds.csv. Fleet view: score_vs_difficulty.csv.
decision_rule: >
  Written before launch. OPERATING-POINT POLICY IS C (Kam, 2026-09-01, after
  Reports/RECIPE_AUDIT_2026-09-01.md): each arm's deployed threshold is selected
  by select_indep_threshold.py from its dense independent sweep - criterion
  f1_plateau_hi_d005 (the HIGHEST k whose F1 sits within 0.005 of the curve's
  peak, on forest_wetland, raw prob). Rationale measured on the pilot curves
  BEFORE any 36-run arm exists: both are flat within 0.005 across a 3x
  threshold range, so strict argmax would deploy the recall-most edge of a
  plateau the metric cannot distinguish; preferring the precision-most end
  suits a crown deliverable scored against C-CAP's broad canopy definition.
  Fallback for an unscorable sweep = fixed 0.5 with a loud flag, NEVER the
  circular best_f1_thresh. In-queue postproc masks are
  PLACEHOLDERS (circular threshold); final masks are re-cut post-run at the
  policy-C threshold on free CPU (postproc --infer-thresh from the registry) and
  re-scored. An arm PASSES when all six steps verify, qc_indep scores it, and
  its selection is non-EDGE (or EDGE inspected and accepted). The campaign
  lands when every arm passes or is listed as a named exception - failures are
  reported, never hidden. 2006s and 2011s are ADOPTED from hard_year_pilot
  (identical recipe, tags hy_e3_*) rather than re-run - ~4-6 A100-hr saved;
  their policy-C re-cut happens with the fleet's. Champion promotion per year
  remains Kam's call (champion_arms.csv), as does launch (GPU gate: 2xA100
  cap, ~65-70 A100-hr estimated for 34 arms, babysitter on every bootstrap).
launch_defaults: ["--force-citywide", "--no-hillshade"]
