name: full_archive_e3
status: queued
hypothesis: >
  The hard-year pilot confirmed the unified citywide EPOCH-3 recipe explains the
  historical weak tail (2011s 0.471 -> 0.756; 2006s 0.470 -> 0.707 with three
  measured imagery strikes). This campaign applies that ONE recipe to the whole
  archive. What would change our mind: multiple arms failing their gates, or
  scoring below their year's prior champion, would mean the pilot did not
  generalize and the recipe premise is wrong.
