name: fusion_5band_nir_chm
kind: measurement-campaign
status: needs-kam
retrospective: true
category: inputs
tags: [fusion, nir, chm, headroom, decision-fusion, one-shot, untracked-result, "2016"]
hypothesis: >
  Before spending an A100 on input-level 5-band (RGB+NIR+CHM) training, ask the cheap
  question first: do the 2016 CHM-input arm and the 2016 NIR-input arm miss the SAME
  trees? If their errors largely coincide, a fused input has nothing to recover and the
  spend is unjustified; if the errors are disjoint, there is headroom. A DECISION-level
  fusion (per-pixel mean of the two arms' probability rasters) stands in for the trained
  model, because the engine has no 5-channel path at all — `--hs-source nir` rides the
  existing 4th-channel machinery, so "5-band" names a probe, never an arm that exists.
arms: []
baseline: null
metric: >
  NOT IN THE TRACKED RECORD, and that is why this entry cannot be signed off. The
  one-shot script's only output path was a session scratchpad, so the error-overlap
  statistics (FN/FP intersection, Jaccard) and the fusion threshold sweep live nowhere
  in the repo or the lake. What IS tracked is the QUESTION, the DESIGN and both arms'
  deployed thresholds, in the script's docstring and constants on the archive branch
  (extra.script). The parent CHM-vs-NIR axis this probe was scouting does have tracked
  homes: Reports/M06_NIR_ARM.md for the equal-channel-count M06 swap, and the
  pre-registered NIR factor in experiments/tier1_science_sample.yaml.
decision_rule: >
  RECONSTRUCTED (retrospective: true) from the script's own docstring, which states the
  two tasks before any result: Task A is error overlap at each arm's OWN deployed
  threshold — the fused-input case is only open if the two arms fail on different
  pixels; Task B sweeps the mean-probability fusion across 21 cuts and compares it
  against both parents at their deployed points AND at each parent's own best point on
  the sweep, scored on the intersection of the two arms' valid footprints so neither is
  credited for coverage the other lacks. Conventions were copied from
  qc/phase4_qc_indep.py rather than reinvented. The docstring names NO noise floor and
  NO pass/fail cut, so even with the numbers in hand the design could not have promoted
  anything — a second reason the result is not a verdict.
verdict: null
decided: null
