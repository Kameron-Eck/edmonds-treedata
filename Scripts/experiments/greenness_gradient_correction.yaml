reports: [Reports/GREENNESS_GRADIENT_CORRECTION_2026-09-03.md]
imagery: ["2013", "2015", "2016", "2019", "2021", "2023"]
sample: >
  the five King-sensor RGB acquisitions whose citywide_rgb arms are scored in
  score_vs_difficulty.csv — 2013, 2015, 2019, 2021, 2023 — holding sensor family, grid
  and recipe class fixed so that season and delivery are the varying factors; plus the
  four years histogrammed for the resolving test (2015, 2016, 2019, 2021), with 2016 as
  the summer leaf-on control. GRVI is computed over pixels the 2020 canopy mask calls
  canopy, in a subset of grid windows per year: indicative, not a probability sample.
