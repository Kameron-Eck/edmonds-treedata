name: hard_year_pilot
status: complete
hypothesis: >
  The archive's four weakest scored arms are all sector_v1-recipe (2006s .470,
  2011s .471, 3003s/2012s .637 f.5) while every citywide-recipe year — including
  2000 at 0.827 with a 22-year reference gap — sits >=0.77. Mining
  (phase4/qc/score_vs_difficulty.csv) says the weakness is the RECIPE, not the
  imagery. Re-running the two worst years under the unified citywide EPOCH-3
  recipe tests that directly; it is the gate before the 36-acquisition run's
  ~70 A100-hours.
arms:
  - {year: "2006s", tag: hy_e3_2006s}
  - {year: "2011s", tag: hy_e3_2011s}
baseline: sectors_v1
metric: >
  qc_indep live rows (forest_wetland, own operating point) for the new arms vs
  the same years' sector_v1 rows; fleet context in score_vs_difficulty.csv.
decision_rule: >
  Written before launch. If both fresh arms reach f.5 >= 0.72 (the bottom of the
  citywide fleet band), the recipe hypothesis stands: GO for the 36-run, no
  special handling. If either stays <= 0.60, imagery is implicated for that year:
  the 36-run still GOES but those years are flagged low-confidence and routed to
  the degradation-synthesis workstream. Between 0.60 and 0.72: UNDETERMINED —
  report both readings to Kam with the noise floor, decide together. The 36-run
  go/no-go itself remains Kam's call in all branches.
launch_defaults: ["--force-citywide", "--no-hillshade"]
verdict: >
  MIXED, read per the rule. 2011s: 0.471 -> 0.756 f.5 — ABOVE the 0.72 line,
  recipe hypothesis CONFIRMED outright. 2006s: 0.470 -> 0.707 — the UNDETERMINED
  band, 0.013 under the line; no measured noise floor exists for cross-arm f.5
  deltas, so per checklist rule 10 that shortfall is UNDETERMINED, not a failure.
  Its residual gap matches its three measured strikes (145 cm effective
  resolution, 9.2 m registration p95, 15-yr reference gap; see IMAGERY_FACTS 14
  and the coregistration table). Specialist reading: the recipe explains the
  great majority of both years' historical deficit; 2006s is genuinely hard
  imagery performing respectably. RECOMMENDATION: GO for the 36-run with 2006s
  flagged low-confidence and first in line for degradation synthesis. The
  36-run go/no-go remains Kam's. Numbers: qc_indep_report.csv live=1 rows.
  Ops note: both arms also stress-tested the reliability layer (a FUSE-race
  evaluate crash, three beacon deaths, one guard/split collision) -> vm_ops
  --queue-args, the campaign-aware registry gate, and vm_babysitter all exist
  because of this experiment. The spent GENERATED queue file is deleted
  (regenerable from git; the generator refuses complete experiments by design).
decided: 2026-09-01
