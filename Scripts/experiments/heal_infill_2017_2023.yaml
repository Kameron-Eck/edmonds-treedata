instruments:
  - Scripts/qc/instruments/temporal_heal.py
  - Scripts/qc/instruments/heal_vs_gold.py
  - Scripts/qc/instruments/crown_trajectories.py
inputs:
  - phase4/qc/panel_a_gold.csv
  - phase4/qc/temporal_heal.csv
outputs:
  - phase4/qc/heal_vs_gold.csv
  - phase4/qc/crown_trajectories.csv
imagery: ["2017", "2020", "2022", "2023"]
sample: >
  Citywide inference if the budget allows; otherwise a spatial sample that MUST contain
  the 1,214 Panel A gold points. Sampling at random would remove the only population
  that can score the result and would defeat the experiment's whole purpose. All four years re-tile.
  Tile dirs exist for every one of them, but under OTHER campaigns' tags (of_2017,
  of_2020, t1_2020_*, of_2022, untagged 2023), and tile_dir_for() keys the directory
  on {label}__{run_tag} — so heal_2017 and its siblings resolve to directories that do
  not exist. Recipe discipline forbids borrowing the old tags in any case. Corrected
  2026-09-07: an earlier version of this line claimed the tiling was already paid for
  on three of the four, which is false in both directions.

supersedes: []
