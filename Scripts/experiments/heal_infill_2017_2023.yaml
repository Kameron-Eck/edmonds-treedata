  arm_notes: >
    heal_2017 — WEAK_CALIBRATION at verify (maxprob < 0.75); trained to epoch 7 of 12
    then never improved; probabilities compressed around 0.5 (held-out F1 0.763 at
    0.490 vs 0.377 at 0.500). Independent score vs C-CAP 2021 (qc_indep_sweep, curve
