name: heal_infill_2017_2023
kind: experiment
status: queued
retrospective: false
category: change
tags: [healing, temporal-backfill, density, panel-a, scoreable, trend8-recipe]

hypothesis: >
  The healing operator cannot currently be scored. Panel A ruled on 2016->2024, but the
  HEAL tier fires only on 2011s, 2013 and 2015 — every later bracket in the trend8 stack
  spans >= 3 years, the distance bigleaf maple coppice crosses, and is therefore BLIND.
  So the operator runs entirely upstream of the interval the human gold covers, and the
  42 verified losses and 1,170 verified no-change points cannot judge it
  (measured: Reports/HEALING_TOOL_REASONING_2026-09-07.md §10).

  Adding 2017, 2020, 2022 and 2023 on the SAME trend8 recipe closes every interior
  bracket inside the Panel A window to under three years. Two things should follow, and
  both are testable. First, healing begins firing where the human truth lives, so the
  frozen gold can score the HEAL tier directly instead of only its censoring behaviour.
  Second, annual cadence makes the REVIEW tier resolvable at all: post-2016 has no lidar
  to veto the laundering path (a real clearing whose regrowth reads as canopy), and at
  three-year gaps nothing in the mask distinguishes that from a detection failure — but
  at one-year gaps a replacement returns SMALL AND GROWING while an artifact returns
  FULL-SIZE AND STATIC. That is Kam's own design note, and it needs density to work.

  What would change our mind: healing that launders verified losses once it operates
  inside the validated window, or a size-trajectory signal that fails to separate the
  two return shapes even at annual cadence.

arms:
  - {year: "2017", tag: heal_2017, extra: [--no-hillshade]}
  - {year: "2020", tag: heal_2020, extra: [--no-hillshade]}
  - {year: "2022", tag: heal_2022, extra: [--no-hillshade]}
  - {year: "2023", tag: heal_2023, extra: [--no-hillshade]}

# The trend8 recipe, verbatim — this campaign exists to EXTEND that series, so any
# deviation reintroduces the confound it was built to control. --force-citywide is not
# optional here or anywhere: polygons/ was overwritten with accept-all test data and the
# 14,476-crown human review was never finished, so the crown labels are provisional
# (CLAUDE.md §4). queue_verify refuses a fine-tier job that declares no label source, and
# it refused this file until this block was added — the guard working as intended.
launch_defaults:
  - --force-citywide

baseline: trend8_uniform_rgb

metric: >
  phase4/qc/heal_vs_gold.csv rebuilt on the 12-epoch stack — laundered and censored
  counts against the 42 verified losses, and impossible-triple removal against the 1,170
  verified no-change points. Secondary: phase4/qc/temporal_heal.csv tier distribution
  (BLIND should fall to zero inside 2016-2024), and phase4/qc/crown_trajectories.csv
  TERMINAL share, which today is 64% of all LOST crowns.

decision_rule: >
  PRE-REGISTERED, before any run. PRIMARY KILL: healing must launder ZERO verified
  losses once it operates inside the Panel A window — the terminal absence of a verified
  loss may never be filled. That is the one result that stops the design outright, and
  the current 0 of 42 was measured only OUTSIDE the window, so it is not yet evidence
  about the case that matters.

  AMENDMENT 2026-09-08, written before any arm of this campaign has a verdict and with the
  original text above left intact: phase4/qc/heal_gap_spectrum.csv (qc/instruments/
  heal_gap_spectrum.py) measured that the PRIMARY KILL as written cannot fire. A verified
  loss has a terminal absence that runs to the end of the series, so the epoch after any
  interior epoch inside it also reads absent and a both-sides fill can never touch it;
  laundered_at_risk is 0 in every gap bucket on the 8-epoch stack and every alignment shift
  quantises to zero cells. 0 of 42 is therefore a criterion with no power, not a bound.
  The operative laundering test for this campaign is the FILL-SIDE audit
  (qc/instruments/heal_fill_audit_sample.py, ~300 fills sampled from the healer output with
  a null-change control, human-read, k/300 reported with its exact upper bound), together
  with the impossible-triple criterion at the no-change points, which keeps its power.
  The 42 remain the population for the ONE-SIDED failure a REVIEW-tier rule could commit
  (laundered_eligible = 28 at L=5). Source: Reports/LIT_HEALING_ANALOGUES_2026-09-08.md
  section 0 item 4 and Reports/HEALING_TOOL_REASONING_2026-09-07.md section 14.

  PROMOTE if, on the 12-epoch stack: (a) laundered = 0 and terminal-censored = 0 against
  the frozen gold; (b) impossible-triple removal at verified no-change points is no worse
  than the 99 of 124 measured on 8 epochs; (c) BLIND brackets inside 2016-2024 fall to
  zero, which is arithmetic and therefore a check on the run rather than a finding.

  RECIPE DISCIPLINE: all four arms run the trend8 recipe. The existing of_2017, of_2020
  and of_2022 masks are NOT used, despite already being on disk with matched cuts,
  because they come from the overlap-floor campaign and mixing training recipes across a
  trajectory series reintroduces exactly the confound trend8 was built to control.
  Matched cuts collapse DELIVERY differences to 0.15 pp; that is not evidence they
  collapse RECIPE differences, and no measurement in the repo says they do.

  Report every recall figure with the gold's measured +/- 7.3 pp. The gold is a
  development set: a promote here licenses the enriched confirmatory draw, not a
  published number.

verdict: null
decided: null

design_doc: Reports/TEMPORAL_REFINEMENT_DESIGN_2026-09-06.md
reports:
