  why_no_imagery_field: >
    the sweep's unit is a FILE, not a catalog label, and it deliberately covers holdings
    with no YEAR_CATALOG entry at all. Mapping the file list onto catalog labels would
    misrepresent what was measured, so the imagery field is left off.
  successor: >
    per-acquisition coregistration against the 2020s anchor (entry
    coregistration_2020s_anchor) is the designed follow-up to this sweep's crossreg
    check; phase4/qc/coregistration.csv is its home, not these files.
  not_included: >
    the separability CSVs dated 2026-08-24 in phase4/qc/ come from a different
    instrument and are not outputs of this suite.
