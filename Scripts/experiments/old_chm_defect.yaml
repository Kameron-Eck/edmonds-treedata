sample: >
  two independent grounds. First, every 2 m ground cell in which the point pass measured
  both a lowest ground-class return and a maximum canopy return — the interpolation-free
  adjudication. Second, the certified-flat reference raster: cells whose height above
  ground was under 2 m in BOTH the 2005 and 2016 clouds, eroded 6 m. The two tests report
  different numbers on purpose and are never averaged.
