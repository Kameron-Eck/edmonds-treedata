name: overlap_floor
status: queued
hypothesis: 'Items 2+5+7 of the flicker-program ranking (2026-09-05, Kam-approved): the
  archive''s OVERLAP structure can decompose the trend8 sawtooth into instrument mechanisms
  without any new ground truth. (2) OVERLAP FLOOR: same-window acquisitions delivered
  differently bound the instrument term - 2017 CoE vs 2017 King share the May 4-10 2017
  flight window (fine vs ~15cm grid); zero real change between them by construction.
  (5) EAGLEVIEW TRIPLE: 2020/2022/2024 CoE 5cm - vendor, GSD, and season all held; the
  strongest same-method series the archive owns; its 2020->2024 net is the method-controlled
  map trend to sign-test against Panel A (-2.21pp). (7) SEASON x GRID FACTORIAL 2017:
  {May: CoE 5cm, King 15cm} x {Aug: 2017s 30cm, 2017n 1m} - the only design that crosses
  season and grid with zero real change inside one calendar year.'
