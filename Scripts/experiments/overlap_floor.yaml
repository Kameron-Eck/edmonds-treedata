baseline: null
metric: 'city-clipped canopy fraction on the common 2m grid (trend8_harmonized_fractions
  method) per arm; paired deltas within the overlap sets.'
decision_rule: 'Written before any run. Same UNIFORM recipe as trend8 (plain RGB,
  --no-hillshade, policy-C criterion) so every overlap delta is an instrument term, never
  a recipe term. READS: (a) |fraction(2017 CoE) - fraction(2017 King)| is the same-window
  cross-delivery floor at May; if it exceeds the 1.3pp same-flight bound (C3) the noise
  model is understated - STOP and re-derive before quoting any map number again. (b) The
  2017 quartet decomposes: season main effect = mean(Aug arms) - mean(May arms); grid main
  effect within season; interaction. If season+grid explain <50% of the quartet spread, a
  fourth mechanism is at work (mosaic seams, BRDF) and the harmonization program is declared
  BOUNDED. (c) EagleView 2020->2022->2024 net change, method-controlled: primary read is
  SIGN vs Panel A on the shared window; agreement rehabilitates method-controlled map
  differencing, disagreement kills map differencing here even under total method control
  (either way a finding, pre-registered). trend8_2024 is reused as the 2024 arm - same
  recipe, no rerun. 2xA100 cap; approved by Kam 2026-09-05 ("Yes to 1 through 8").'
verdict: null
decided: null
