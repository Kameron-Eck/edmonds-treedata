hypothesis: >
  The overhauled machinery (U1-U3, D-series, EPOCH 2) can run one calendar year at
  three tiers end-to-end unattended, producing a deliverable mask, an independent
  score, and a complete ledger per arm — the go-condition for the 36-acquisition run.
arms:
  - {year: "2019", tag: pilot_e2_fine}
  - {year: "2019s", tag: pilot_e2_medium}
  - {year: "2019n", tag: pilot_e2_coarse}
