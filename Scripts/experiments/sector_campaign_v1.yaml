imagery: ["2003s", "2006s", "2011s", "2012s", "2016", "2018s", "2020s", "2021s"]
sample: >
  eight arms on eight acquisitions — six un-adapted 2020-checkpoint baselines (tag
  sectors_v1, a byte-for-byte copy of the phase-3 checkpoint, so they measure what the
  un-adapted model does on previously unscored years) and two full-extent fine-tunes
  (tag fullext_sectors_v1) — with inference restricted to five west-east strips standing
  in for the city, and the city fraction rebuilt from them by a design-based estimator
  over those five strata.
