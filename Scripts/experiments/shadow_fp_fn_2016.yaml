extra:
  docx_sections: [EXP-A-shadow-fp-fn-2016]
  needs_kam_reason: >
    The probe's primary output is a session scratchpad markdown file that was never
    committed to the repo or the lake; it is the only holder of the FP/TP densities,
    the two band ratios and the NDVI table. The reading itself is also not a clean
    verdict: the fairness control FAILED, so the band test is CONFOUNDED by an
    imagery-vs-CHM displacement rather than answering the shadow question, and the
    hypothesis is unsupported at the deployed threshold rather than refuted. Writing a
    verdict on an untracked, confounded measurement is exactly what needs-kam prevents.
    Kam's call: re-run the probe under the measurement contract, or close on the FN-side
    tracked evidence alone.
  script: >
    archive/2026-08-pre-refactor:Scripts/scratch/shadow_fp_overlay.py — recoverable with
    `git show`; a scratch one-shot, archived so it can never re-run. Template was
    scratch/roof_fp_overlay.py (FP definition, C-CAP scheme, deployed threshold and TP
    control all copied rather than reinvented).
  tracked_corroboration: >
    the probe's all-TP pixel count is EXACTLY the tp cell of the 2016 fullext_sectors_v1
    forest_wetland row in phase4/qc/qc_indep_report.csv at its deployed threshold, and
    that threshold matches phase4/qc/score_vs_difficulty.csv. That ties the untracked
    output to two tracked rows on both the operating point and the TP population; it
    does not make the FP-density cells themselves tracked.
  side_finding_that_outlived_the_probe: >
    the failed fairness control is a systematic ~5 m east-side ortho-vs-CHM displacement
    at crown edges. It is cited as a measurement in
    Reports/DEGRADED_IMAGERY_RESEARCH_2026-08-27.md and is the stated reason
    Scripts/pipeline/builders/build_lidar_quadrants.py erodes its tall/tall class. The
    magnitude is a band-scale inference, not a measured offset vector.
  fn_half_caveats:
    - the forest-miss outputs were committed 2026-08-18 and cover five years; they
      PREDATE the shadow probe and are a companion line of evidence, not part of the
      same run
    - zero DARKER bullets is not "no darker misses" — the 6 DN gate suppresses at least
      one real sub-threshold darker/greener inversion, recorded only in
      archive/2026-08-pre-refactor:Scripts/CHATLOG.md
  ndvi_screen_status: >
    MOOT for this error class on the probe's own reading — the near-tree false positives
    are vegetated understory/grass at crown margins, a different population from the
    open cast shadows on hardscape Kam observed separating in the NIR stack. Untracked
    like the rest of the FP half.
