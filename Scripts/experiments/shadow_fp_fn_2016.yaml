name: shadow_fp_fn_2016
kind: measurement-campaign
status: needs-kam
retrospective: true
category: errors
tags: [shadow, false-positives, ndvi-screen, displacement, forest-misses, "2016"]
hypothesis: >
  Kam's hypothesis (2026-08-26), in two halves. FP side: the model's false positives
  pile up on the DOWN-SUN side of crowns, where dark shadow texture next to canopy gets
  misread as canopy — and if so, the normalized NIR/NDVI stack, which he observed
  separates bright trees from dark shadow cleanly, could screen them out at little
  recall cost. FN side: the canopy the model FAILS to find is systematically darker
  than the canopy it recalls, i.e. misses are shadowed. What would change our mind on
  the FP half is a shadow-side FP density no higher than the up-sun control once the
  two bands are shown to be geometrically comparable.
arms: []
baseline: null
metric: >
  FP HALF: NOT IN THE TRACKED RECORD — the per-region FP/TP densities, the shadow/up-sun
  ratios and the NDVI comparison exist only in an untracked session scratchpad; the
  script that wrote them is archive-branch tracked (extra.script). FN HALF: tracked, in
  the AUTO-DIAGNOSIS block of phase4/qc/forest_miss_{2000,2002,2013,2015,2016}.txt,
  written by Scripts/qc/instruments/phase4_qc_forest_misses.py. The scored arm's
  operating point and TP population are tracked in phase4/qc/qc_indep_report.csv (the
  2016 fullext_sectors_v1 forest_wetland row, live=1) and phase4/qc/score_vs_difficulty.csv.
decision_rule: >
  RECONSTRUCTED (retrospective: true) from the script docstring, which pre-registers
  three things before any number. (1) The sun direction is measured, not assumed: sweep
  candidate directions in 15-degree steps and take the one whose adjacent down-direction
  ground band is DARKEST in the ortho — "if no direction clearly wins, stop." (2) The
  shadow casters are the CHM height field, never C-CAP, whose over-generalized
  residential blobs are not physical shadow casters; C-CAP stays the truth layer for
  FP/TP so every row matches the live qc_indep convention. (3) TP density is the
  GEOMETRIC-FAIRNESS CONTROL: geometrically comparable bands must return equal TP
  densities, and a band pair that fails that control cannot have its FP comparison read
  at all. On the FN side the rule is the instrument's own reporting gate — a
  BRIGHTER/DARKER bullet fires only when the brightness delta exceeds 6 DN
  (phase4_qc_forest_misses.py), so silence is a reporting threshold, never a null.
verdict: null
decided: null
