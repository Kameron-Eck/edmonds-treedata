imagery: ["2000", "2002", "2013", "2015", "2016"]
sample: >
  FP half: one 2016 probability raster (fullext_sectors_v1) at its deployed threshold,
  partitioned into three off-tree-ground regions on its own grid — a down-sun band, the
  identical up-sun control band, and all remaining CHM-valid non-canopy ground — with
  overlap pixels excluded from both bands. FN half: the five years for which the tracked
  forest-miss instrument has emitted an AUTO-DIAGNOSIS block.
supersedes: []
