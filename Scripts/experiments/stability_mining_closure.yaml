sample: >
  one imagery year (2009), five label variants plus their one-variable baselines, all
  scored on ONE common footprint — the intersection of every arm's valid pixels with
  the scorable 2016 hi-res C-CAP reference under forest_wetland. The quadrants leg adds
  a seed replicate and a paired block bootstrap over 512x2048 px blocks, whose effective
  n is the block count and never the pixel count.
