  arms_not_claimed_here: >
    kind is measurement-campaign, so this entry declares no (year, tag) arms and owns no
    tags. The tag names above are provenance, listed so a reader can find the runs.
  registry_gaps: >
    groves_lidar, nodec_s1234 and rgb3_nodeb_s1234 have labels/tile/train rows in
    run_registry.csv but NO inference row, so only the five confirmed terminal run_ids
    are cited.
  retraction_that_must_travel_with_this_entry: >
    "Kam's lidar hard negatives work as designed" is RETRACTED and VOID. The two groves
    arms ran concurrently on 2009 while the tile cache was keyed by year only, so they
    raced on one directory and both models trained on an unknown mixture of each other's
    labels. Kam's lidar-negatives idea is UNTESTED, not disproven. Fixed by per-arm tile
    dirs in commit 507dff6. Retraction text: archive/2026-08-pre-refactor:Scripts/CHATLOG.md.
  thin_provenance: >
    the sparse arms' matched-precision recalls and their calibration table live only in
    an untracked session scratchpad; the tracked Reports/ARM_PR_CURVES_2009.md is a
    DIFFERENT arm pair and must not be cited for the groves arms. The 21-26 pp gap and
    the verdict prose are recoverable from the archive-branch CHATLOG.
  do_not_quote:
    - the sparse effect as a settled sigma count — the recall sd in the denominator is
      n=5 SAME-SEED and the source file calls it a lower bound, so the sigma count is an
      upper bound. The pp gap is the robust statement.
    - the hybrid as the most under-counting of all 13 arms — a deliberately corrupted
      arm under-counts more; hybrid_v1 is the most under-counting of the non-corrupted
      arms.
    - the hybrid as a 0.7% dose — it was 85% no-op and therefore never one-variable;
      the ruling is 0.53% effective, two variables.
    - quadrants as null — its own pre-registered band returned UNRESOLVED, and it
      replicated on area.
  binding_caveats_on_the_area_leg:
    - a 2016 reference scored against a 2009 raster puts real 2009-2016 change inside
      the ABSOLUTE bias, so only the RELATIVE comparison is sound
    - this is the sectors_v1 AOI, not citywide
    - the replicate's near-unbiased area comes from CANCELLATION of large opposite
      errors, not from being right
  filename_hazard: >
    phase4/qc/holdout_design_census_2009.md contains a bootstrap CI, not the census its
    name promises; and five phase4/qc/*_2009.md files whose names promise
    area/damage/noisefloor/replication content all carry the generic title "FP/FN
    balance by region" and hold only TP/FP/FN/recall/precision. Area figures are DERIVED
    from those counts, never read from a column.
  live_successor: >
    tier1_science_sample pre-registered the lidar-as-label ADDER factor across three
    years with a different reference and a different statistic, AOI-restricted to sample
    ground blocks. Do not pool any Tier-1 number with the 2009 numbers above.
  variant_verdict_dates: >
    sparse and hybrid closed 2026-08-28, the quadrants replicate 2026-08-29 (archived
    CHATLOG entry headings); the area re-read tables landed the same day. The
    2026-09-03 findings ledger re-read the three as one thread but decided nothing new.
