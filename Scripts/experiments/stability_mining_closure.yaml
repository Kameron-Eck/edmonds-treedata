name: stability_mining_closure
kind: measurement-campaign
status: complete
retrospective: true
category: labels
tags: [stability-mining, sparse-labels, hybrid, lidar-quadrants, node-c, calibration, "2009"]
hypothesis: >
  Only 2020 has hand labels, so every old year is supervised by projecting the 2020 mask
  onto it. If that projected key is the binding constraint, then labels MINED for
  cross-era stability — crowns that read as canopy under every model of every era, plus
  dual-epoch lidar evidence of height — should beat it when training an old imagery
  year. Three variants attack the same question from different sides: replace the key
  with a sparse verified one, keep the key and overwrite only where verification exists,
  or add lidar-certified canopy on top of a one-variable baseline. What would change our
  mind is an arm that beats the projected key at a matched operating point by more than
  the recipe's own run-to-run spread.
arms: []
baseline: null
metric: >
  phase4/qc/qc_indep_report.csv (2009 rows, live=1, forest_wetland) for the arms'
  operating points; phase4/qc/arm_pr_curves_2009_3band.md and
  phase4/qc/arm_pr_curves_2009_3band_noisefloor.md for the threshold-free curves, the
  matched-operating-point tables, the calibration mass and the recipe's noise floor;
  phase4/qc/campaign_area_reread_2009.md and
  phase4/qc/region_confusion_2009_replication.md for the regional confusion counts the
  canopy-area bias is derived from; phase4/qc/damage_curve_area_2009.md,
  phase4/qc/seed_area_noisefloor_2009.md and phase4/qc/ep60_replication_area_2009.md
  for the label-error dose response and the seed floors; phase4/qc/nodec_gain_inside_vs_outside_2009.md
  and phase4/qc/holdout_design_census_2009.md for the paired block bootstrap on the
  inside/outside split. Curve summary for the sparse leg also in Reports/ARM_PR_CURVES_2009.md.
decision_rule: >
  RECONSTRUCTED (retrospective: true) from the arms' queue-file reads and the archived
  verdict prose. Three rules, one per variant, and each was stated before its result.
  SPARSE is judged at MATCHED PRECISION against the baseline's precision at 0.5, never
  at a shared fixed cut, because a sparse-label arm is differently calibrated and a
  fixed cut would credit it for merely sitting at a more liberal operating point.
  HYBRID exists to separate label CORRECTNESS from label QUANTITY — keep the projected
  key, overwrite only proven pixels, IGNORE nowhere — so a null there means correcting
  the key is not the lever, whatever the sparse arms did. QUADRANTS was judged against a
  band fixed BEFORE its replicate landed: dAUROC at or above +.0060 replicates, at or
  below +.0020 does not stand, anything between is UNRESOLVED and must be reported as
  such rather than as a null (CLAUDE.md 3.5). A late addition to the reading, adopted
  when the ranking metric came back inside the band: canopy AREA is the deliverable and
  AUROC is structurally blind to the operating point, so the area re-read is a second
  pre-declared axis, floored by the same-recipe seed spread rather than by a nominal cut.
verdict: >
  CLOSED AS THREE DIFFERENT ANSWERS, and the composite read is that the projected 2020
  key is more right than it looks. SPARSE is decisively refuted: replacing the key with
  a mined verified key costs 21-26 pp of recall at matched precision against a recall sd
  the source file itself calls a LOWER bound — the verdict prose and the matched-
  precision table are in archive/2026-08-pre-refactor:Scripts/CHATLOG.md, and the
  threshold-free curves that agree with it for the baseline arm are in
  Reports/ARM_PR_CURVES_2009.md. The mechanism is measured, not guessed: sparse labels
  BREAK CALIBRATION, parking a large share of valid pixels within a hundredth of 0.5
  where the baseline parks far fewer (calibration table, same archived source), so the
  naive fixed-cut "recall win" for the sparse arm is an artifact of operating point.
  HYBRID is a clean null on the ranking metrics —
  recall 0.6253 at precision 0.8792 against the baseline's 0.6989 / 0.8472, both read
  from the live=1 forest_wetland rows of phase4/qc/qc_indep_report.csv — and the reason
  is also measured: the damage curve shows AUROC is flat across the whole injected
  label-error range, so label error moves the OPERATING POINT, not discrimination, and
  a sub-percent correction could never have paid. QUADRANTS is the one variant that is
  not dead. On the pre-registered ranking band it is UNRESOLVED, not null: AUROC gaps of
  +.0116 then +.0053 over the one-variable baseline, from the four curve cells in
  phase4/qc/arm_pr_curves_2009_3band_noisefloor.md, against a band fixed before the
  replicate landed at +.0060 to replicate and +.0020 to fall (the band itself is
  recorded only in archive/2026-08-pre-refactor:Scripts/CHATLOG.md) — positive twice,
  above the refutation line twice, short of the replication line once. On canopy area,
  the deliverable metric, it REPLICATES in both runs by a margin several times the
  baseline seed pair's own spread, derived from the confusion counts in
  phase4/qc/campaign_area_reread_2009.md and phase4/qc/region_confusion_2009_replication.md
  — but it also roughly quadruples run-to-run variance on both metrics, so it buys
  accuracy and pays in stability. STANDING: the live successor is the Tier-1 lidar
  factor, which is a different year set, reference and statistic; nothing here pools
  with it.
