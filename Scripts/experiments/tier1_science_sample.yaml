name: tier1_science_sample
status: queued
hypothesis: >
  The training-side knobs the recipe audit left open — lidar as label context,
  lidar as an input channel, and the 4th (NIR) band — are testable cheaply on a
  fixed, screened, spatially-split ground sample before any full-archive spend
  (design: TIER1_SCIENCE_SAMPLE_PLAN_2026-09-02.md). What would change our
  mind per question: a lidar-adder win above the measured noise floor in >=2 of
  the 3 non-2020 years says projected labels are correctably wrong and the
  36-run should train on lidar-gated labels; an input-channel win says the
  model is information-starved, not just label-limited; an NIR win on BOTH
  sensors says the archive's 4-band years deserve 4-band arms. Null results
  above the floor close those questions with numbers instead of instinct.
