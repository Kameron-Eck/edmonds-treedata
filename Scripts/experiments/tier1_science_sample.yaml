baseline: null   # within-year: each year's t1_{year}_base cell
metric: >
  Dense sweeps qc_indep_sweep_{year}_{tag}_*.csv restricted to the sample's
  TEST blocks; policy-C selections in phase4/qc/indep_thresholds.csv (chosen
  on SELECTION blocks); paired-delta table harvested to
  phase4/qc/tier1_results.csv. Numbers live there, never here.
decision_rule: >
  Written before any run exists. SAMPLE: fixed ground blocks, stratified and
  screened (CHM coverage in both epochs, coreg-quiet, radiometric
  representativeness), split train/selection/test ONCE; the same blocks for
  every arm; train and early-stop on train/selection blocks, policy-C
  threshold chosen on selection blocks, scores read from test blocks only.
  NOISE FLOOR: the max pairwise |delta| among t1_2011s_base{,_s2,_s3} on the
  primary statistic; any arm delta at or below it is UNDETERMINED, never a
  win. PRIMARY STATISTIC: recall at precision 0.75 from the test-block sweep
  (curve-matched); F1 at the arm's own policy-C point is secondary. KILL RULE
  (pre-launch, free): a lidar-adder arm whose additions raster changes under
  2% of its year's labeled sample pixels is STRUCK before launch and recorded
  here — it cannot move anything. VERDICTS: lidar-adder pathway CONFIRMED if
  the adder beats base by more than the floor in >=2 of {2006s, 2011s, 2016};
  lidar-input likewise; NIR CONFIRMED only if nir beats base on BOTH 2016 and
  2019n (one of two = sensor-specific, reported as such); corruption doses
  produce a dose-response slope (calibration, no pass/fail). 2020 arms are the
  sanity anchor: a "win" appearing ONLY on 2020 is suspect (its labels are
  least wrong; little to correct). GPU: 2xA100 concurrency cap; utilization
  reported as registry step-hours / session wall-hours with target >=0.85;
  torch-free steps run on CPU VMs, never on the A100s. Launch flags per arm
  are generated into this file's arm `extra` lists when the Phase-0 builders
  land, BEFORE the queue is generated; the science content above does not
  change after results exist. Launch itself remains Kam's (GPU gate).
verdict: null
