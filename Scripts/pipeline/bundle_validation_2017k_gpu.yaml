# HAND-SPLIT launch file for experiments/bundle_validation_2017k.yaml — one runtime, one
# steps: subset. Same job id in both split files so the queue ledger merges their rows by
# (job, year, tag, step). Deliberately NOT carrying the GENERATED header: the drift test
# requires a headered file to equal the full regeneration, which a split file cannot.
# Hypothesis, decision rule and baseline live in the experiment file, not here.
# THIS FILE: gpu — A100: train only, launched AFTER cpu1 records VERIFY:tile OK, with
#   --env PHASE4SEG_TILE_BUNDLE=1 so the train step READS the bundle. Evaluate, inference
#   and postproc are deliberately not run (nothing to read from them; GPU cost only).
- id: bundle_validation_2017k_spdv_2017k
  year: '2017k'
  tag: spdv_2017k
  steps: [train]
  extra:
  - --force-citywide
  - --no-hillshade
  why: gpu slice of experiments/bundle_validation_2017k.yaml — hypothesis and decision rule live THERE, not here.
