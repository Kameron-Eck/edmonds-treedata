# PILOT SLICE — calendar year 2019 (overhaul Stage 5). ONE TIER, ONE RUNTIME.
#
# The shared rationale — why 2019 supplies all three tiers, why 2019s vs 2019n is a
# same-flight resolution pair, why every job runs RGB-only, and what the four-part
# gate is — lives in pipeline/pilot_2019_fine.yaml and is not repeated here.
#
# ONE QUEUE PER RUNTIME (COLAB_AUTONOMY_SETUP.md). The three pilot tiers run
# CONCURRENTLY on three A100s, so they are three queue files rather than one with
# three jobs. The queues run in parallel; the colab CLI calls that start them do
# NOT — a concurrent `colab exec` SIGTERM'd a sibling launcher mid-bootstrap on
# 2026-08-29 and left an unbootstrapped, watchdog-less VM billing.

- id: "pilot_2019_medium"
  year: "2019s"
  tag: pilot_e2_medium
  extra: ["--force-citywide", "--no-hillshade"]
  why: "medium tier (30.5 cm) AND the high side of the same-flight resolution pair with 2019n — same 2019-10-11 sensor day, so resolution is the only variable between them."
  expect: "labels ~7 min; tile ~26 min; train ~36 min; evaluate ~5 min; inference ~5 min; postproc unmeasured. ~1 h 20 median."
