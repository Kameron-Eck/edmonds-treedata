# GOLDEN-GATE v2 QUEUE — INFERENCE-ONLY re-runs over the sentinel-window AOI (2026-08-26).
#
# WHY. qc/phase4_golden_gate.py scores the 12 frozen sentinel windows. Sector-restricted
# arms (--infer-aoi aoi/sectors_v1.json) intersect only ~1 of those 12, so the five
# grass / impervious / water NEGATIVES — the windows that watch FP regression — are
# UNSCORABLE for every sector arm. Each job below re-runs an EXISTING checkpoint over
# aoi/sentinel_v1.json (the 12 windows, +30 m pad, 2.50% of the 2016 grid) so the arm
# gets full 12-window golden coverage. NOTHING is retrained: no labels, no tiling, no
# fine-tune, no new science — only a second prob raster over different ground.
#
# P7 OVERWRITE RULE. Every job carries a NEW run tag. No existing raster is touched;
# each arm's citywide/sector prob raster stays exactly as scored. `golden_v1_*` names
# the GATE COVERAGE generation, not the arm — the arm identity is the checkpoint the
# job copies from (see pipeline/golden_v2_ckpt_map.csv).
#
# PRE-SEEDED. labels/tile/train/evaluate are pre-seeded OK in
# phase4/qc/train_queue_status_queue_golden_v2_seed.csv so ONLY inference runs. The
# seed MUST be written VM-side before launch — see pipeline/golden_v2_launch_README.md.
# Without it the queue starts five full fine-tunes.
#
# CHECKPOINTS. The engine loads sem_best_{year}_{tag}.pt (phase4seg/common.py::_tag_sfx),
# so each job needs a Drive-to-Drive copy of its source ckpt to the golden tag name
# BEFORE launch. The map is pipeline/golden_v2_ckpt_map.csv (the vm_copy_ckpts idiom).
#
# JOB IDS are fresh on purpose: phase4_train_queue._completed_steps() merges ALL
# train_queue_status*.csv and keys on (job, step). Reusing `2016_fx` or `2021s_fx`
# would hit their historical inference=OK rows and silently skip the job.
#
# EXPECT MOSTLY_NODATA. _check_prob_raster flags a raster whose valid fraction is under
# 5%, and that state is a VERIFY hard-fail. This AOI is 2.5% BY DESIGN, so every job will
# end "VERIFY:inference MOSTLY_NODATA / stopping this job". The raster is already written
# and copied by then, inference is the last step, and the queue continues to the next job
# — nothing is lost. Judge each raster by its detail line (valid≈2.5%, maxprob, p99.9),
# not by the state. Full explanation: pipeline/golden_v2_launch_README.md.
#
# COST. ~2-5 min/job of GPU (2.5% of the grid) plus per-job imagery staging, which the
# AOI does NOT shrink — 2016 (1-ft, 4-band) and 2021s (6-in, 4-band) stage in full.
# Two distinct orthos across five jobs; the engine's local stage cache means the second
# and later jobs on the same year re-copy only if the cache was cleared.
- id: "2016cw_g"
  year: "2016"
  tag: golden_v1_2016cw
  extra: ["--force-citywide", "--infer-aoi", "aoi/sentinel_v1.json", "--skip-postproc"]
  why: >-
    2016 UNTAGGED citywide baseline (sem_best_2016.pt) — the arm every later 2016
    result is compared against, and currently golden-blind on all 5 negatives.
    NOTE: this ckpt was fine-tuned when the 2016 catalog entry still pointed at the
    41.9%-coverage study clip; the catalog now resolves the full-extent
    2016_snoh_1ft_rgbi.tif, so the gate reads it on the full delivery. Same sensor and
    year, but say "scored on the full-extent ortho" whenever this row is quoted.
  expect: "prob raster edmonds_canopy_prob_2016_golden_v1_2016cw.tif; ~2.5% valid, rest 255; 2-5 min."
- id: "2016corr_g"
  year: "2016"
  tag: golden_v1_2016corr
  extra: ["--force-citywide", "--infer-aoi", "aoi/sentinel_v1.json", "--skip-postproc"]
  why: >-
    2016 corrected-label arm (sem_best_2016_corrected.pt). The corrected-vs-untagged
    delta is the whole point of that arm and it has never been measured on the
    negatives — the windows a label correction is most likely to move.
  expect: "prob raster …_2016_golden_v1_2016corr.tif; 2-5 min. Pairs with 2016cw_g."
- id: "2016fx_g"
  year: "2016"
  tag: golden_v1_2016fx
  extra: ["--force-citywide", "--infer-aoi", "aoi/sentinel_v1.json", "--skip-postproc"]
  why: >-
    2016 full-extent arm (sem_best_2016_fullext_sectors_v1.pt). Its shipped prob raster
    is sector-restricted, so its golden row today rests on ~1 window. Completes the
    three-way 2016 comparison (untagged / corrected / fullext) on identical ground.
  expect: "prob raster …_2016_golden_v1_2016fx.tif; 2-5 min."
- id: "2021sp2_g"
  year: "2021s"
  tag: golden_v1_2021sp2
  extra: ["--force-citywide", "--infer-aoi", "aoi/sentinel_v1.json", "--skip-postproc"]
  why: >-
    2021s p2nir arm (sem_best_2021s_p2nir.pt) — a 4-channel NIR model. The engine adopts
    in_channels and hs_source FROM THE CKPT, and 2021_snoh_6in_rgbi.tif has band 4, so
    the M06 NIR gate passes. Half of the fullext-vs-p2nir verdict.
  expect: "prob raster …_2021s_golden_v1_2021sp2.tif; 2-5 min. Log must print the
    'ckpt was trained with --hs-source nir — adopting it' line; if it does not, stop."
- id: "2021sfx_g"
  year: "2021s"
  tag: golden_v1_2021sfx
  extra: ["--force-citywide", "--infer-aoi", "aoi/sentinel_v1.json", "--skip-postproc"]
  why: >-
    2021s full-extent arm (sem_best_2021s_fullext_sectors_v1.pt). The other half of the
    fullext-vs-p2nir verdict, and the arm the noise-floor repeats are measuring sigma
    around — so its 12-window golden row is the reference those repeats need.
  expect: "prob raster …_2021s_golden_v1_2021sfx.tif; 2-5 min. Last job."
