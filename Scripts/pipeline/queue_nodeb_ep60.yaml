# NODE B RERUN AT A PROPER CEILING — 2009, 3-band, projected key, epochs-B 60.
# Kam 2026-08-29 (all-night run).
#
# ONE VARIABLE vs rgb3_nodeb: the epoch ceiling. Everything else identical.
#
# WHY THIS IS THE MOST LOAD-BEARING RERUN AVAILABLE. Read from the loss
# histories: rgb3_nodeb's BEST EPOCH WAS 30 OF 30 — its final epoch. It was
# still improving when the cap cut it off. Two headline numbers rest on it:
#   (1) "the height channel is worth 10 pp" = Node A .6989 - Node B .5990
#   (2) "Node C beats Node B by 5.3 pp" (proven-canopy labels)
# Both compare a CONVERGED arm against a TRUNCATED one, so both are inflated
# by an unknown amount. If Node B climbs materially past epoch 30, both need
# restating; if it plateaus at 33, they stand and we lost an hour.
#
# The cap truncates ASYMMETRICALLY — harder configurations (3-band, corrupted
# labels) need more epochs and get proportionally less training — so it biases
# in favour of whatever makes learning easier. That is a systematic error in
# every A/B this project has run, not a one-off.
#
# NOT combined with --select-smooth: smoothing cannot fix truncation (a
# still-rising series still selects at its edge), and combining them would
# move two variables. Smoothing gets its own arm AFTER this one lands.
#
# Stop reason is now printed and recorded — this run will say plainly whether
# it ended by PATIENCE or CAP, which is the diagnostic we lacked.
- id: "2009_nodeb_ep60"
  year: "2009"
  tag: rgb3_ep60
  extra: ["--force-citywide", "--no-hillshade", "--epochs-phase-b", "60",
          "--infer-aoi", "aoi/sectors_v1.json"]
  why: "does Node B keep climbing past the 30-epoch cap? two headline numbers depend on it."
  expect: "retile ~20 min; train up to ~3.5 h if it uses the ceiling; inference ~5 min."
