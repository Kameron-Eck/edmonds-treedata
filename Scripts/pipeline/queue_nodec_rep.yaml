# NODE C REPLICATE — same arm, different training seed. Kam 2026-08-29 (all-night).
#
# WHY. Node C is the ONLY positive result this project has produced this week:
# 3-band + proven canopy labels beat 3-band alone by AUROC +.0116 / PR-AUC +.0223,
# and it held against BOTH a 30-epoch and a 60-epoch Node B. But it rests on ONE
# training run. Tonight's seed pair measured what a seed change alone is worth:
# AUROC .0016, PR-AUC .0012 — small, which is why the win looks solid — but
# matched-precision recall swung 3 pp on nothing but the seed, so single-run
# results in this pipeline have earned suspicion.
#
# Replicating the one thing that worked is worth more than a new hypothesis.
#
# ONE VARIABLE vs nodec_v1: --seed 1234. Same labels (add_nodec_2009.tif), same
# 3 bands, same AOI, same everything. Tiling binds its seed at import so the
# train/val/test split is IDENTICAL — this isolates training stochasticity.
#
# ** PRE-REGISTRATION REVISED 2026-08-29 12:07Z, BEFORE THIS RUN LANDED, because
# the n=3 seed result invalidated the original bands. ** The first version keyed
# off "within ~.002 of .9179", built on an n=2 retrain estimate of .0016 AUROC.
# seed777 then landed and the n=3 SPREAD is .0047 AUROC — so a replicate at
# .912-.916 would have fallen in a zone with NO pre-registered reading, on the
# week's most important replication. Reading that post-hoc is precisely what
# pre-registration exists to stop. Revised bands below, on the GAP rather than on
# the absolute number, because the gap is what the claim is:
#
#   Two independent draws spread ~sqrt(2) x .0047 ~= .0066, so judge
#   dAUROC = nodec_s1234 - rgb3_nodeb (.9063):
#     >= ~.006   REPLICATED. Node C stands.
#     <= ~.002   DOES NOT STAND. The original was a lucky draw, and this is the
#                single most important negative of the week — report it as loudly
#                as the positive was reported.
#     .002-.006  UNRESOLVED. Not a win, not a refutation. Say "unresolved, needs a
#                third run" and do NOT pick whichever reading flatters the week.
#
# ALSO PRE-REGISTERED: run the inside/outside split (phase4_arm_bootstrap_ci.py
# --split-mask, 75 px buffer) on the replicate. nodec_v1 gained +.0043 AUROC
# inside the labelled region and +.0303 OUTSIDE it — on ground where both arms
# trained on identical labels. If the replicate reproduces that OUTSIDE-dominant
# shape, the generalisation result replicates STRUCTURALLY, which is a stronger
# and far less noise-sensitive test than matching .9179 to three decimals. A
# replicate that lands mid-band on the gap but reproduces the shape is better
# evidence than one that matches the number and does not.
- id: "2009_nodec_rep"
  year: "2009"
  tag: nodec_s1234
  extra: ["--force-citywide", "--no-hillshade", "--seed", "1234",
          "--infer-aoi", "aoi/sectors_v1.json",
          "--add-canopy-mask", "/content/drive/MyDrive/treedata/phase4/labels_corrected/add_nodec_2009.tif"]
