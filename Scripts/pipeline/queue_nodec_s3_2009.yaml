# NODE C, THIRD SEED. 2026-08-29 (all-night).
#
# WHY, and why it is worth an A100 hour regardless of how the replicate lands.
# The week's headline rests on Node C. Tonight the 4-band family taught us what a
# third run is worth: n=2 said retrain noise was .0016 AUROC, n=3 said .0047 —
# three times larger — and the third run was the one that revealed the failure
# mode (roughly 1 run in 3 converges early to a worse optimum, visible already at
# the end of phase A). An n=2 claim about Node C has exactly the weakness that
# n=2 claim about noise had.
#
# ONE VARIABLE vs nodec_v1: --seed 2024. Same overlay, same 3 bands, same AOI.
# Tiling binds its seed at import, so the train/val/test split is identical.
#
# PRE-REGISTERED READ, on the GAP vs rgb3_nodeb (.9063), same bands as the
# replicate (two draws spread ~sqrt(2) x .0047 ~= .0066):
#   >= ~.006   replicated
#   <= ~.002   does not stand
#   .002-.006  unresolved
# With three Node C runs the honest summary becomes the SPREAD of the three gaps,
# reported as a range, not a mean with a fabricated sigma.
#
# ALSO PRE-REGISTERED: run the inside/outside split at BOTH the 75 px and the
# 512 px (full-training-tile) buffer. The 512 px number is the one that matters —
# the model trains on 512 px tiles, so any tile containing an added label gets
# better supervision across its whole area, and only a full-tile buffer separates
# transfer from tile-level spillover.
- id: "2009_nodec_s3"
  year: "2009"
  tag: nodec_s2024
  extra: ["--force-citywide", "--no-hillshade", "--seed", "2024",
          "--infer-aoi", "aoi/sectors_v1.json",
          "--add-canopy-mask", "/content/drive/MyDrive/treedata/phase4/labels_corrected/add_nodec_2009.tif"]
  why: "turn the week's headline from n=2 into n=3, after n=3 tripled the noise estimate on the other branch."
  expect: "retile ~40 min; train ~35 min; inference ~5 min."
