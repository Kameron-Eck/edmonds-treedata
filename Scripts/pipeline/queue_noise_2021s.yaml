# NOISE-FLOOR QUEUE (2026-08-26, Kam-authorized overnight GPU) — three same-recipe
# repeats of the 2021s fullext fine-tune under distinct run tags. PURPOSE: measure the
# run-to-run sigma of honest recall/precision, the prerequisite for EVERY promotion
# band (M04) and for the fullext-vs-p2nir verdict.
#
# HONESTY NOTE: the engine has no --seed flag (RANDOM_SEED fixed at 42), so these
# repeats vary ONLY through accepted nondeterminism (cudnn.benchmark + AMP) — they
# measure the HARDWARE-NONDETERMINISM FLOOR, a LOWER BOUND on full retrain sigma.
# Label every derived number accordingly. The seed-varied arm follows once a --seed
# flag lands through the preflight/smoke gates and the branch can push.
#
# Tiling: identical signature to 2021s_fx -> the existing 705-tile cache is reused
# (no retile). Artifacts: sem_best_2021s_noise_r{1..3}.pt, prob rasters tagged
# noise_r{1..3}, sector-restricted inference (~11% of grid).
- id: "2021s_nr1"
  year: "2021s"
  tag: noise_r1
  extra: ["--force-citywide", "--infer-aoi", "aoi/sectors_v1.json"]
  why: "noise-floor repeat 1/3 — same recipe as 2021s_fx, new tag."
  expect: "train ~45 min A100 (tile cache hit); sector inference ~7 min."
