# NOISE-FLOOR QUEUE B (2026-08-26, Kam-authorized overnight GPU) — remaining
# same-recipe repeats of the 2021s fullext fine-tune under distinct run tags.
# PURPOSE: measure the run-to-run sigma of honest recall/precision, the
# prerequisite for EVERY promotion band (M04) and the fullext-vs-p2nir verdict.
#
# HONESTY NOTE: the engine has no --seed flag (RANDOM_SEED fixed at 42), so these
# repeats vary ONLY through accepted nondeterminism (cudnn.benchmark + AMP) — they
# measure the HARDWARE-NONDETERMINISM FLOOR, a LOWER BOUND on full retrain sigma.
# Label every derived number accordingly. The seed-varied arm follows once a --seed
# flag lands through the preflight/smoke gates and the branch can push.
#
# nr2r: rerun of noise_r2, whose first run died at train epoch 24 to a transient
# copystat EIO on the rclone mount (fixed in common.py 457bc85; the crashed run's
# sem_*_noise_r2.pt checkpoints are overwritten by this rerun — it produced no
# inference raster, so nothing scored is superseded).
#
# Tiling: identical signature to 2021s_fx -> the existing 705-tile cache is reused
# (no retile). Artifacts: sem_best_2021s_noise_r{2,4,5}.pt, prob rasters tagged
# noise_r{2,4,5}, sector-restricted inference (~11% of grid).
- id: "2021s_nr2r"
  year: "2021s"
  tag: noise_r2
  extra: ["--force-citywide", "--infer-aoi", "aoi/sectors_v1.json"]
  why: "rerun of noise repeat 2/5 (first run crashed at epoch 24, copystat EIO)."
  expect: "train ~45 min A100 (tile cache hit); sector inference ~7 min."
