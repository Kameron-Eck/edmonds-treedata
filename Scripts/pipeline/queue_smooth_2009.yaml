# SELECT-SMOOTH ARM — 2009, 3-band, K=5 checkpoint selection. Kam 2026-08-29
# ("run node B, and smooth the validation curve").
#
# ONE VARIABLE vs Node B (rgb3_nodeb): --select-smooth 5. Same 3 bands, same
# projected-2020 citywide labels, same AOI, same default seed, same 30-epoch cap.
#
# WHAT THE FLAG DOES. Today the deployed checkpoint is the single epoch with the
# highest validation IoU-at-best-threshold. K=5 instead scores each epoch by the
# average of itself and its two neighbours on each side, and deploys the peak of
# THAT curve. Early stopping is untouched — this changes which epoch is kept, and
# nothing else about training.
#
# WHY IT IS WORTH AN A100 HOUR — measured offline tonight, no GPU, by replaying
# the selection rule against seven arms' saved loss histories
# (scratchpad/smooth_probe.py). In phase B of every single arm, the spread across
# the top five candidate epochs is SMALLER than the average epoch-to-epoch wobble
# of the same curve:
#
#   arm          top5 spread   mean |epoch-to-epoch|   ratio
#   rgb3_ep60      .0024            .0049              0.49
#   rgb3_nodeb     .0016            .0022              0.73
#   nodec_v1       .0018            .0028              0.64
#   seed1234       .0013            .0016              0.81
#   corrupt25      .0007            .0016              0.44
#   hybrid_v1      .0010            .0038              0.26
#   chm2_v1        .0020            .0037              0.54
#
# Read plainly: the top five epochs are tied to within less than one epoch's
# random jitter, so picking the argmax is close to drawing one of five at random,
# and the one it draws is the one that got the luckiest validation noise. That is
# selection ON noise, which is a mild form of overfitting the validation split.
#
# THE HYPOTHESIS THIS TESTS: the smoothed pick will score LOWER on validation (it
# is not the val argmax by construction) but EQUAL OR BETTER on the independent
# reference. Val down + independent up is the signature of removing selection
# bias. Val down + independent down means the raw peak was real signal and this
# flag should be left at 1.
#
# ** THE PRIMARY READ IS NOW PAIRED (52cff83, landed after this file was first
# written and BEFORE this arm ran, so this run produces it). ** The engine used to
# overwrite the raw-peak checkpoint with the smoothed one; it now keeps it as
# sem_rawbest_2009_smooth5.pt. Both picks come from the SAME trajectory, so
# scoring both is a comparison with NO retrain noise in it — the only difference
# between the two rasters is which epoch was deployed. That resolves effects far
# below the ~.002 cross-run floor, which is the whole difficulty here.
#   To score the raw half: copy sem_rawbest_2009_smooth5.pt to
#   sem_best_2009_smooth5raw.pt and run --step inference --run-tag smooth5raw
#   (raster inference reads only the checkpoint and the ortho — no tiles, no
#   retrain, ~5 min), then arm_pr_curves smooth5,smooth5raw.
#   smooth5 AUROC > smooth5raw = smoothing helps, and this says so cleanly.
#   If the two picks land on the SAME epoch the engine skips the rewrite, no
#   sem_rawbest_ file appears, and the answer is "no-op on this trajectory".
#
# The cross-arm read below is now SECONDARY — kept because it is what relates
# this arm to the Node B baselines, but it is noise-limited and was never going
# to be decisive on its own.
#
# PRE-REGISTERED READ (curve metrics only — matched-precision recall is ~3x
# noisier and is not the verdict metric). Baselines, both Node B, same recipe:
#   rgb3_nodeb   AUROC .9063  PR-AUC .8365   (30-epoch B cap, best epoch = 30 = AT the cap)
#   rgb3_ep60    AUROC .9086  PR-AUC .8322   (60-epoch B cap, best epoch 17, stopped ep32)
#
# HOW BIG IS THE NOISE — stated honestly, because the first draft of this file
# got it wrong. Those two runs are NOT the same recipe twice: the cap differs,
# and it BOUND on the first one (its best epoch was the last epoch it was allowed
# to run). So their .0023 AUROC gap is "cap change + noise", an UPPER bound on
# noise, not a measurement of it. The 3-band branch has no clean same-recipe
# repeat at all. The closest real measurement is the 4-band seed pair on the
# Node A branch: .0016 AUROC / .0012 PR-AUC from a seed change alone.
# Working noise floor for this read: ~.002 AUROC, and treat it as soft.
#
#   AUROC > .9110 (best baseline + ~.002)  = smoothing plausibly helps; do NOT
#                                            adopt on this alone — confirm at
#                                            K=3 and on the Node C branch.
#   AUROC inside .9060-.9110               = INSEPARABLE from noise. The honest
#                                            output is "no measurable effect at
#                                            n=1", not a winner.
#   AUROC inside .9040-.9060               = also INSEPARABLE — within noise of
#                                            the LOWER baseline. Stated so the
#                                            read stays mechanical at 5 a.m.
#   AUROC < .9040                          = smoothing hurts; the raw val peak
#                                            carries real signal after all.
# A single run CANNOT resolve an effect smaller than the noise floor, and this
# arm is not expected to. Its job is to rule out a LARGE effect in either
# direction cheaply, on a GPU that would otherwise sit idle.
#
# Retiles: new run_tag cuts a fresh per-arm tile dir (~15-20 min). Unavoidable
# under tag isolation, and cheaper than risking the rgb3_nodeb baseline cache.
- id: "2009_smooth5"
  year: "2009"
  tag: smooth5
  extra: ["--force-citywide", "--no-hillshade", "--select-smooth", "5",
          "--infer-aoi", "aoi/sectors_v1.json"]
  why: "does averaging the validation curve before picking the deployed epoch beat picking its noisy argmax?"
  expect: "retile ~15-20 min; train ~30-40 min A100; sample inference ~5 min."
